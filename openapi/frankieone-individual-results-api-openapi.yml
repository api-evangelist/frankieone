            format: uuid
            description: The document ID of the selfie that was compared.
          comparedSelfieAttachmentId:
            type: string
            format: uuid
            description: The attachment ID of the selfie that was compared.
    Supplementary-Data-Matchlist-Field:
      type: object
      description: 'Entity data that resulted in a match at the time of execution.

        '
      required:
      - objectId
      - objectType
      properties:
        objectId:
          type: string
          description: Unique identifier of the matched object.
        objectType:
          $ref: '#/components/schemas/Object-Type'
        matchedAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Matchlist-Attribute'
    Matchlist-Entry-Base:
      type: object
      description: Basic details about a matchlist entry, excluding metadata.
      properties:
        entryId:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the matchlist entry.
        entityId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: The entity ID from which the attributes of this entry are derived. This is optional and can be used to link the matchlist entry to an entity.
        entityType:
          $ref: '#/components/schemas/Entity-Type'
          description: The type of entity from which the attributes of this entry are derived. This is optional and can be used to link the matchlist entry to an entity.
        reference:
          type: string
          description: Optional reference describing the context of this entry.
          example: CERT-BAD-ACTOR-1234-5678
        reasons:
          description: The reasons for the matchlist entry. These codes will be translated to configured description strings.
          type: array
          items:
            $ref: '#/components/schemas/Matchlist-Entry-Reason-Code'
    Supplementary-Data-Duplicate-MatchedRule:
      type: object
      description: 'Provides details about the rule that was matched to classify the object as a duplicate.

        '
      properties:
        name:
          type: string
          description: The name of the matched rule.
        strength:
          type: string
          description: "The strength of the match. This is free-form, but it is recommended to use standard values for clarity, such as:\n  - \"VERY_LOW\"\n  - \"LOW\"\n  - \"MEDIUM\"\n  - \"HIGH\"\n  - \"VERY_HIGH\"\n"
    Supplementary-Data-KYC-Address:
      type: object
      description: 'Defines the matching levels for each address element, where available.

        Provides a match strength score ranging from 0 (no match) to 100 (full match).

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-KYC-Address-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
          wasNameMatchStrongEnough:
            description: 'Indicates whether there was a sufficiently strong name match at the time this was checked, even if the address was a perfect match.

              This is only an indicator at the time the PRO was created. Subsequent checks that reuse this result may interpret this differently.

              '
            type: boolean
    Process-Result-Manual-StatusEnum-IDV:
      type: string
      enum:
      - CLEAR
      - REJECTED
      description: 'Any manual status set after the results have been reviewed.

        - CLEAR: When the result is determined to be clear and no further action is needed.

        - REJECTED: When the result is determined to be rejected and no further action is needed.

        '
    List-Operation-Meta:
      type: object
      description: Meta information about the request and response returned during a list operation.
      properties:
        page:
          type: integer
          description: The current page number of the request.
        total:
          type: integer
          description: The total number of items found for the search criteria.
        limit:
          type: integer
          description: The limit applied to this response.
        count:
          type: integer
          description: The number of items returned in this response.
        sort:
          type: string
          enum:
          - asc
          - desc
          description: The sort order applied to the items in the response.
        sortFields:
          type: array
          items:
            type: string
            enum:
            - createdAt
            - updatedAt
    Supplementary-Data-AML:
      type: object
      required:
      - serviceProvider
      description: 'Each AML match/hit generates a PRO, and this object describes the details of the matched individual or business.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          serviceProvider:
            type: string
            description: 'The name of the service provider from which this matched record was retrieved.

              '
          searchId:
            type: string
            description: 'The service provider''s search reference number, usually used to refer to an ongoing search.

              '
          caseId:
            type: string
            description: 'If the service provider has case management facilities, this is their case identifier. May be the same as the search ID.

              '
          referenceId:
            type: string
            description: 'An additional reference number provided by the service provider, or our own reference number.

              '
          originalStepSearchLevel:
            type: string
            description: 'Indicates if this was a simple PEP or PEP media check that found this match. Used to determine if more information is needed when re-using existing results.

              '
          groupingId:
            type: string
            description: 'Some matches can be grouped together as part of a collection of searches. This can be the searchId or a reference ID.

              '
          reportUrl:
            type: string
            format: uri
            description: 'If the service provider supplies a pre-packaged report that can be downloaded independently, this is the URL to retrieve it.

              '
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
          matchData:
            $ref: '#/components/schemas/Supplementary-Data-AML-MatchData'
          aliases:
            type: array
            items:
              type: string
              description: Alternative names, aliases, "AKA"s, or names as spelled in other languages, etc.
          relatedParties:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-RelatedParties'
          referenceDocs:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
          notes:
            $ref: '#/components/schemas/Custom-Attributes'
          pepData:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-PEPData'
          sanctionData:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-SanctionsData'
          watchlistData:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-WatchlistData'
          mediaData:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-MediaData'
  securitySchemes:
    Api-Key:
      type: apiKey
      in: header
      name: api_key
      description: ''
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

      - $ref: '#/components/parameters/Api-Key'
      - $ref: '#/components/parameters/X-Frankie-CustomerID'
      - $ref: '#/components/parameters/X-Frankie-CustomerChildID'
      - $ref: '#/components/parameters/X-Frankie-Channel'
      - $ref: '#/components/parameters/X-Frankie-Username'
      - $ref: '#/components/parameters/profileNameQuery'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/createdAtBefore'
      - $ref: '#/components/parameters/createdAtAfter'
      - $ref: '#/components/parameters/updatedAtBefore'
      - $ref: '#/components/parameters/updatedAtAfter'
      - $ref: '#/components/parameters/stepNames'
      - $ref: '#/components/parameters/stepTypes'
      - $ref: '#/components/parameters/objectTypes'
      - $ref: '#/components/parameters/classes'
      - $ref: '#/components/parameters/systemStatuses'
      - $ref: '#/components/parameters/manualStatuses'
      - $ref: '#/components/parameters/states'
      - $ref: '#/components/parameters/results'
      - $ref: '#/components/parameters/sortFields'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      tags:
      - Individual Results
      security:
      - Api-Key: []
      - jwt:
        - kyc:api
components:
  parameters:
    systemStatuses:
      name: systemStatuses
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: 'List of systemStatus values to filter results with

        Available values : VALID, EXPIRED, STALE, MARKED_INVALID, MARKED_IGNORE'
    entityId:
      name: entityId
      in: path
      schema:
        type: string
      description: Unique FrankieOne identifier for an entity
      required: true
    X-Frankie-Username:
      name: X-Frankie-Username
      in: header
      description: Username provided by API caller
      required: false
      schema:
        type: string
        example: fred.flintstone@frankieone.com
    stepTypes:
      name: stepTypes
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: A list of stepTypes the Process Result is associated with
    X-Frankie-CustomerChildID:
      name: X-Frankie-CustomerChildID
      in: header
      required: false
      schema:
        type: string
        example: 87654321-4321-4321-4321-210987654321
      description: Your Customer Child ID provided by FrankieOne
    createdAtBefore:
      name: createdAtBefore
      in: query
      schema:
        type: string
        format: date-time
      description: Filter on the createdAt field, results returned are based on being before the value (inclusively)
      example: '2024-02-29T02:15:04Z'
    sortFields:
      name: sortFields
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: 'List of fields that the Process Results will be filtered with

        Available values : createdAt, updatedAt'
    X-Frankie-Channel:
      name: X-Frankie-Channel
      in: header
      required: false
      schema:
        type: string
      description: 'Open string that can be used to define the "channel" the request comes in from. It can potentially be used in routing and risk calculations upon request. Default values that can be used are:  api portal smartui Any alphanumeric string is supported though. Anything over 64 characters will be truncated.'
    page:
      in: query
      name: page
      example: 2
      schema:
        type: integer
      description: The page number that you want to retrieve for the list query
    objectTypes:
      name: objectTypes
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: List of objectTypes to filter upon
    updatedAtBefore:
      name: updatedAtBefore
      in: query
      schema:
        type: string
        format: date-time
      description: Filter on the updatedAt field, results returned are based on being before the value (inclusively)
      example: '2024-02-29T02:15:04Z'
    classes:
      name: classes
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: 'List of classes to filter results with Available values : KYC, ID, IDV, AML, FRAUDLIST, FRAUDCHECK, DEVICE, MOBILE, EMAIL, LOOKUP, CREATE, UPDATE, DELETE, MANUAL, ORGANIZATION_PROFILE, ORGANIZATION_OWNERSHIP'
    manualStatuses:
      name: manualStatuses
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        description: 'List of manualStatus fields to filter results with Available values : UNKNOWN, FALSE_POSITIVE, TRUE_POSITIVE, TRUE_POSITIVE_REJECT, TRUE_POSITIVE_ACCEPT, PASS, FAIL'
    profileNameQuery:
      name: profileName
      in: query
      schema:
        type: string
      description: The unique name of the service profile
    results:
      name: results
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: 'List of result value that the Process Result will be filtered with

        Available values : MATCH, PARTIAL_MATCH, INVALID_MATCH, NO_MATCH, CLEAR, HIT, BAD_DATA, CREATED, UPDATED, DELETED, FAIL'
    Api-Key:
      name: api_key
      in: header
      schema:
        type: string
        example: 245c765b124a098d09ef8765....
      description: Your API key provided by FrankieOne
      required: true
    limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        default: 20
      example: 20
      description: Limit the number of items that will be returned as part of the request
    createdAtAfter:
      name: createdAtAfter
      in: query
      schema:
        type: string
        format: date-time
      description: Filter on the createdAt field, results returned are based on being after the value (inclusively)
      example: '2024-02-29T02:15:04Z'
    stepNames:
      name: stepNames
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: List of steps to include, separated by a comma.
    sort:
      in: query
      name: sort
      schema:
        type: string
        enum:
        - asc
        - desc
      description: Order of the sort fields will be sorted upon
    updatedAtAfter:
      name: updatedAtAfter
      in: query
      schema:
        type: string
        format: date-time
      description: Filter on the updatedAt field, results returned are based on being before the value (inclusively)
      example: '2024-02-29T02:15:04Z'
    X-Frankie-CustomerID:
      name: X-Frankie-CustomerID
      in: header
      required: true
      schema:
        type: string
        example: 12345678-1234-1234-1234-123456789012
      description: Your Customer ID provided by FrankieOne
    states:
      name: states
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      description: 'List of state values to filter results with

        Available values : IN_PROGRESS, COMPLETED, TIMEOUT, ERROR'
  schemas:
    Session:
      type: object
      description: Session details for an activity, this is always scoped to a singular entity.
      properties:
        token:
          type: string
          description: A token to identify the specific session for the activity
    Phone-Number-ID:
      type: string
      description: 'As phone numbers are added to an entity, they are assigned an ID to assist with tracking.

        If you are adjusting phone numbers, you will need to include the ID to reference it correctly in the list.'
      example: ad165f64-5717-4562-b3fc-2c963f66bfa9
    Supplementary-Data-Activity-Device:
      type: object
      description: 'Defines the details of an activity device result.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          riskLevel:
            type: string
          activityResults:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail'
    Process-ResultEnum:
      type: string
      enum:
      - MATCH
      - PARTIAL_MATCH
      - INVALID_MATCH
      - NO_MATCH
      - CLEAR
      - HIT
      - BAD_DATA
      - CREATED
      - UPDATED
      - DELETED
      - FAIL
      - NOT_APPLICABLE
      - SUSPECTED
      - REJECTED
      - MANUAL
      - CLEAR_AUTO
      - OVERRIDE
      readOnly: true
      description: 'The actual pass/fail result of the element check

        - MATCH: The element check matched the expected criteria.

        - PARTIAL_MATCH: The element check partially matched the expected criteria.

        - INVALID_MATCH: The element check matched but was invalid.

        - NO_MATCH: The element check did not match the expected criteria.

        - CLEAR: The element check was cleared.

        - HIT: The element check hit a specific condition or threshold.

        - BAD_DATA: The element check encountered bad data.

        - CREATED: The element check resulted in the creation of a new record.

        - UPDATED: The element check resulted in the update of an existing record.

        - DELETED: The element check resulted in the deletion of a record.

        - FAIL: The element check failed.

        - NOT_APPLICABLE: The element check was not applicable in the given context.

        - SUSPECTED: The element check raised a suspicion but did not confirm it.

        - REJECTED: The element check was rejected.

        - MANUAL: The element check was manually reviewed or processed.

        - CLEAR_AUTO: The element check was cleared automatically.

        - OVERRIDE: The element check was overridden by a manual action or system rule.

        '
    Supplementary-Data-Matchlist:
      type: object
      description: 'Each match against a matchlist entry generates a PRO (Process Result Object), and this object describes the details of the matched entry.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Matchlist-Entry-Base'
      - type: object
        properties:
          matchlistId:
            type: string
            format: uuid
            description: Unique identifier for the matchlist.
          matchlistName:
            type: string
            description: Unique name of the matchlist.
          matchlistAction:
            $ref: '#/components/schemas/Matchlist-Action'
          confidence:
            $ref: '#/components/schemas/Search-Confidence'
          matchedFields:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-Matchlist-Field'
    Supplementary-Data-AML-SanctionsData:
      type: object
      description: 'Contains sanction information about a specific matched entity.

        '
      properties:
        countryCode:
          type: string
          description: 'The ISO 3166-1 alpha-3 country code where the sanction entry was recorded.

            '
        countryName:
          type: string
          description: 'The ISO 3166 country name where the sanction entry was recorded.

            '
        sourceName:
          type: string
          description: 'The source of the sanction entry data.

            '
        sourceUrl:
          type: string
          format: uri
          description: 'The URL where the original sanction information can be found.

            '
        sourceReason:
          type: string
          description: 'The reason provided for sanctioning the individual or organization.

            '
        listingStart:
          type: string
          description: 'The date when the listing started. Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        listingEnd:
          type: string
          description: 'The date when the listing ended (if available or known). Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        imageUrl:
          type: string
          format: uri
          description: 'Optional URL of an image of the person or company logo of the sanctioned entity.

            '
        referenceDocs:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
        additionalData:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-AdditionalData'
    Supplementary-Data-Activity-AML:
      type: object
      description: 'Provides details of an activity Anti-Money Laundering (AML) result.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          riskLevel:
            type: string
            description: Indicates the assessed risk level for the activity.
          activityResults:
            type: array
            description: A list of detailed results for the activity AML check.
            items:
              $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail'
    Supplementary-Data-Fraud-IP-Address:
      type: object
      description: 'Defines the details of a single IP address fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Supplementary-Data-Fraud-IP-Address-Data'
    Process-Result-Manual-StatusEnum-AML:
      type: string
      enum:
      - TRUE_POSITIVE
      - FALSE_POSITIVE
      - TRUE_POSITIVE_ACCEPT
      - TRUE_POSITIVE_REJECT
      - UNKNOWN
      - UNKNOWN_ACCEPT
      - UNKNOWN_REJECT
      description: 'The manual status that the AML process result should be set to after the results have been reviewed.

        - FALSE_POSITIVE: The result is determined to be a false positive, but you do not necessarily want to resolve it.

        - FALSE_POSITIVE_ACCEPT: The result is determined to be a false positive and you want to resolve it. "Accept" infers you want to accept the activity.

        - TRUE_POSITIVE: The result is determined to be a true positive, but you do not necessarily want to resolve it.

        - TRUE_POSITIVE_REJECT: The result is determined to be a true positive and you want to resolve it. "Reject" infers you want to reject the activity.

        - UNKNOWN: The result is determined to be unknown, but you do not necessarily want to resolve it.

        - UNKNOWN_ACCEPT: The result is determined to be unknown and you want to resolve it. "Accept" infers you want to accept the activity.

        - UNKNOWN_REJECT: The result is determined to be unknown and you want to resolve it. "Reject" infers you want to reject the activity.

        '
    Likelihood:
      type: string
      description: 'Likelihood of a particular scenario

        '
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - VERY_HIGH
      - UNKNOWN
    Supplementary-Data-AML-WatchlistData:
      type: object
      description: 'Contains non-PEP/non-sanction watchlist and other source information about a specific matched entity.

        '
      properties:
        countryCode:
          type: string
          description: 'The ISO 3166-1 alpha-3 country code where the watchlist entry was recorded.

            '
        countryName:
          type: string
          description: 'The ISO 3166 country name where the watchlist entry was recorded.

            '
        sourceName:
          type: string
          description: 'The source of the watchlist entry data.

            '
        sourceUrl:
          type: string
          format: uri
          description: 'The URL where the original watchlist information can be found.

            '
        sourceReason:
          type: string
          description: 'The reason provided for adding the individual or organization to the watchlist.

            '
        listingStart:
          type: string
          description: 'The date when the listing started. Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        listingEnd:
          type: string
          description: 'The date when the listing ended (if available or known). Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        imageUrl:
          type: string
          format: uri
          description: 'Optional URL of an image of the person or company logo of the entity on this list.

            '
        referenceDocs:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
        additionalData:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-AdditionalData'
    Issue:
      type: object
      properties:
        issue:
          type: string
          description: Description of the issue.
        issueLocation:
          type: string
          description: The location or context where the issue was identified.
        issueType:
          type: string
          description: The type or category of the issue.
    Process-Result-Manual-StatusEnum-Fraud:
      type: string
      enum:
      - FALSE_POSITIVE_ACCEPT
      - FALSE_POSITIVE_REJECT
      - TRUE_POSITIVE_ACCEPT
      - TRUE_POSITIVE_REJECT
      description: 'The status that the fraud process result should be set to after the results have been reviewed.

        - FALSE_POSITIVE_ACCEPT: When the result is determined to be false positive and it is an acceptable risk.

        - FALSE_POSITIVE_REJECT: When the result is determined to be false positive and it is an unacceptable risk.

        - TRUE_POSITIVE_ACCEPT: When the result is determined to be true positive and it is an acceptable risk.

        - TRUE_POSITIVE_REJECT: When the result is determined to be true positive and it is an unacceptable risk.

        '
    Supplementary-Data-Activity-Result-Detail-Indicator:
      type: object
      properties:
        indicatorId:
          $ref: '#/components/schemas/Indicator-ID'
        name:
          type: string
        value:
          type: string
        score:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Rule'
    Supplementary-Data-Matchlist-Attribute:
      type: object
      description: 'Information about a matched attribute within a matched field.

        '
      required:
      - type
      - confidence
      properties:
        type:
          $ref: '#/components/schemas/Matchlist-Entry-Attribute-Type'
        confidence:
          $ref: '#/components/schemas/Search-Confidence'
          description: 'Confidence score for the attribute match.

            '
    Supplementary-Data-Fraud-Device-Data:
      type: object
      description: 'Provides details of a single fraud check for device and related device data.

        '
      properties:
        device:
          $ref: '#/components/schemas/Device'
        session:
          $ref: '#/components/schemas/Session-Data'
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Indicator'
        riskLevel:
          $ref: '#/components/schemas/Risk-Level'
        reference:
          $ref: '#/components/schemas/Result-Reference'
    Request-ID:
      type: string
      example: 01HN9XHZN6MGXM9JXG50K59Q85
      description: The unique request identifier for the API call made.
    Supplementary-Data-KYC-Address-MatchStrengths:
      type: object
      properties:
        fullAddress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetNumber:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetName:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetType:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetAll:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        locality:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        district:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        subdivision:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        postalCode:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        country:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    Entity-ID:
      type: string
      description: 'Entities are assigned an auto-generated UUID to ensure global uniqueness, represented as entityId. The entityId allows for precise modification when required.

        To modify an entity, set the entityId of the entity you wish to update in an update request.'
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      readOnly: true
    Supplementary-Data-AML-ReferenceDocs:
      type: object
      description: 'Captures references to source documents or websites, including the URL and, where available, a description of the original source.

        '
      properties:
        url:
          type: string
          format: uri
          description: URL of any external reference document related to this matched entity.
        description:
          type: string
          description: If a description of the document is provided, it will be included here.
    Matchlist-Entry-Reason-Code:
      type: string
      description: The reason code for the matchlist entry. This code will be translated to a configured description string. Supported codes are 1 to 24 characters long, consisting only of uppercase letters (A-Z), digits (0-9), underscores (_), or hyphens (-), with no spaces or special characters.
      pattern: ^[A-Z0-9_-]{1,24}$
    Supplementary-Data-Fraud-Email-Address:
      type: object
      description: 'Defines the details of a single email fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          emailAddressId:
            $ref: '#/components/schemas/Email-Address-ID'
          riskLevel:
            $ref: '#/components/schemas/Risk-Level'
          reference:
            $ref: '#/components/schemas/Result-Reference'
          indicators:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Indicator'
    Process-Result-Object:
      type: object
      properties:
        processResultId:
          $ref: '#/components/schemas/Process-Result-ID'
        schemaVersion:
          type: integer
          readOnly: true
        entityId:
          type: string
          readOnly: true
        requestId:
          $ref: '#/components/schemas/Request-ID'
          readOnly: true
        stepName:
          type: string
          readOnly: true
        stepType:
          type: string
          readOnly: true
        objectType:
          type: string
          readOnly: true
        objectId:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        groupId:
          type: string
          readOnly: true
        providerResult:
          $ref: '#/components/schemas/Provider-Result'
        result:
          $ref: '#/components/schemas/Process-ResultEnum'
        class:
          $ref: '#/components/schemas/Process-Result-ClassEnum'
        supplementaryData:
          $ref: '#/components/schemas/Supplementary-Data'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Process-Result-Error'
          readOnly: true
        notes:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Custom-Attributes'
        systemStatus:
          $ref: '#/components/schemas/Process-Result-System-StatusEnum'
        manualStatus:
          $ref: '#/components/schemas/Process-Result-Manual-StatusEnum'
        state:
          $ref: '#/components/schemas/Process-Result-StateEnum'
        riskFactors:
          type: array
          items:
            $ref: '#/components/schemas/Process-Risk-Factor-Value'
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    ConfidenceLevel:
      type: object
      properties:
        normalized:
          description: 'The normalized confidence level, if set.

            Note: This is a normalized value, NOT the one used by the service provider (see the "actual" field).

            Assumes a scale of 0.0 (exact match) to 100.0 (match anything).

            '
          type: number
          format: float
          minimum: 0
          maximum: 100
        actual:
          description: 'The actual confidence level as provided by the service provider, if set.

            Note: This is not a normalized value, but the original value from the provider.

            '
          type: string
    IP-Information:
      type: object
      description: IP information, typically in relation to a device
      properties:
        v4Address:
          type: string
          description: The IPv4 address
          format: ipv4
        v6Address:
          type: string
          description: The IPv6 address
          format: ipv6
        trueAddress:
          type: string
          description: The true IP address
        asn:
          type: string
          description: The ASN of the IP address
        connectionType:
          type: string
          description: The type of IP connection (if available)
          example:
          - Fixed Line ISP
        location:
          $ref: '#/components/schemas/Geolocation'
    Supplementary-Data-Visa:
      type: object
      description: 'Defines the Visa details returned from VEVO.

        Class and subclass values can be found on the VEVO website.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          country:
            type: string
            description: Country of origin (ISO-3166-alpha3 code).
          class:
            type: string
            description: Visa class.
          subClass:
            type: string
            description: Visa subclass.
          entitlementStatus:
            type: string
            description: Status of the visa entitlement.
          grantDate:
            type: string
            format: date
            description: Date the visa was granted.
          expiryDate:
            type: string
            format: date
            description: Date the visa expires.
          hasExpired:
            type: boolean
            description: Indicates if the visa has expired (sometimes expiry date is not returned).
          noExpiry:
            type: boolean
            description: Indicates if this visa has no expiry.
          entitlementConditionCode:
            type: string
            description: Code for the entitlement condition.
          entitlementConditionDescription:
            type: string
            description: Description of the entitlement condition.
          holderType:
            type: string
            enum:
            - PRIMARY
            - SECONDARY
            description: "Indicates if this is the primary visa holder or a secondary holder (usually a spouse/partner or other family member).\nValues:\n  - PRIMARY\n  - SECONDARY\n"
          lookupErrorCode:
            type: string
            description: If there was an error during the lookup, this is the code returned from VEVO.
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Supplementary-Data-AML-PEPData:
      type: object
      description: 'Contains Politically Exposed Person (PEP) information about a specific matched entity.

        '
      properties:
        countryCode:
          type: string
          description: 'The ISO 3166-1 alpha-3 country code where the PEP entry was recorded.

            '
        countryName:
          type: string
          description: 'The ISO 3166 country name where the PEP entry was recorded.

            '
        sourceName:
          type: string
          description: 'The source of the PEP entry data.

            '
        level:
          type: string
          description: 'The PEP "level", generally represented by a number from 1 (heads of state, military, civil service, etc.) to 4 (local government, minor public servants, etc.).

            '
        sourceUrl:
          type: string
          format: uri
          description: 'The URL where the original PEP information can be found.

            '
        sourcePosition:
          deprecated: true
          type: string
          description: '(Deprecated) The position held that created the PEP entry.

            '
        position:
          type: string
          description: 'The position held that created the PEP entry.

            '
        positionDescription:
          type: string
          description: 'A description of the position held that created the PEP entry.

            '
        status:
          type: string
          description: 'The current PEP status.

            '
        listingStart:
          type: string
          description: 'The date when the listing started. Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        listingEnd:
          type: string
          description: 'The date when the listing ended (if available or known). Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        imageUrl:
          type: string
          format: uri
          description: 'Optional URL of an image of the person associated with their role.

            '
        referenceDocs:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
        additionalData:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-AdditionalData'
    Activity-Result-ID:
      type: string
      readOnly: true
      description: Activity Result ID that identifies a result from an evaluation of an activity
      format: ulid
    Activity-ID:
      type: string
      readOnly: true
      description: Activity ID that identifies an activity within the Frankie platform
      format: ulid
    Supplementary-Data-KYB-Organization:
      type: object
      description: 'Defines OQRO (Ownership Query Result Object) at various stages in the KYB (Know Your Business) flow.

        The ''oqro'' property temporarily stores the V1 OQRO and will be used until the V2 OQRO is defined.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          organization:
            description: 'V2 OQRO; to be defined in the future.

              '
            properties:
              entityId:
                $ref: '#/components/schemas/Entity-ID'
              entityType:
                $ref: '#/components/schemas/Entity-Type'
    Supplementary-Data-AML-AdditionalData:
      type: object
      description: 'Represents a simple key-value pair for AML data to capture any additional information not included in the main object.

        '
      properties:
        key:
          type: string
          description: 'The key name, formatted in snake_case (e.g., key_in_snake_case), which can be converted to spaced title case for display.

            '
        value:
          type: string
          description: 'The value associated with the key, provided as a string for display purposes.

            '
    Supplementary-Data-IDV-Facial-Comparison:
      type: object
      description: 'Result of a facial comparison check, indicating how likely or accurate the presented face matches the ID document.


        For resultMap keys, use the keys found in the enum: SupplementaryDataIDVEnumDataFacialComparison.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-IDV-Base'
      - type: object
        properties:
          comparedDocumentId:
            type: string
            format: uuid
            description: The document ID of the ID document that was compared.
          comparedDocumentAttachmentId:
            type: string
            format: uuid
            description: The attachment ID of the ID document that was compared.
          comparedSelfieId:
            type: string
            format: uuid
            description: The document ID of the selfie that was compared.
          comparedSelfieAttachmentId:
            type: string
            format: uuid
            description: The attachment ID of the selfie that was compared.
    Process-Result-Manual-StatusEnum-Matchlist:
      type: string
      enum:
      - FALSE_POSITIVE
      - TRUE_POSITIVE_REJECT
      description: 'Any manual status set after the results have been reviewed.

        - FALSE_POSITIVE: The result is determined to be a false positive, but you do not necessarily want to resolve it.

        - TRUE_POSITIVE_REJECT: The result is determined to be a true positive and you want to resolve it. "Reject" infers you want to reject the activity.

        '
    Supplementary-Data-Duplicate:
      type: object
      description: 'Provides details of a single duplicate match, including the matching entity ID and a list of matched elements.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          duplicateEntityId:
            $ref: '#/components/schemas/Entity-ID'
            description: The entity ID of the entity that was matched by the matched fields.
          matchedFields:
            type: array
            description: The list of fields that determined this is a duplicate of another entity.
            items:
              $ref: '#/components/schemas/Supplementary-Data-Duplicate-MatchField'
          matchedRules:
            type: array
            description: The list of rules that were matched to determine this is a duplicate of another entity.
            items:
              $ref: '#/components/schemas/Supplementary-Data-Duplicate-MatchedRule'
    Rule-ID:
      type: string
      readOnly: true
      format: ulid
      description: Rule ID that identifies an instance of a rule within the Frankie platform
    Error-Base:
      type: object
      properties:
        errorCode:
          type: string
        errorMsg:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    Process-Result-ID:
      type: string
      description: When a process result object is first created, it is assigned an ID. When updating the process result object, set the processResultID to the ID of the process result object you are referring to.
      readOnly: true
    Supplementary-Data-Duplicate-MatchField:
      type: object
      description: 'Provides details of a match between entities, the objects they represent, and the match strength.

        '
      properties:
        objectType:
          $ref: '#/components/schemas/Object-Type'
        duplicateObjectId:
          type: string
          format: uuid
          description: The ID of the object that was found to be a duplicate.
        objectId:
          type: string
          format: uuid
          description: The ID of the object that originated the match.
        matchStrength:
          $ref: '#/components/schemas/Supplementary-Data-Base-MatchStrength'
    Supplementary-Data-AML-MediaData:
      type: object
      required:
      - title
      - source
      description: 'Contains adverse media information about a specific matched entity.

        '
      properties:
        title:
          type: string
          description: 'The title of the article or media source.

            '
        snippet:
          type: string
          description: 'A short excerpt or snippet from the article.

            '
        source:
          type: string
          description: 'The source or publisher of the article or media.

            '
        sourceDate:
          type: string
          description: 'The publication date, as referenced and formatted by the source.

            '
        sourceCountry:
          type: string
          description: 'The country of origin for the article, if available.

            '
        url:
          type: string
          description: 'The URL to the original full article, if available.

            '
        isCurrent:
          type: boolean
          default: true
          description: 'Indicates whether this article is still considered current.

            '
    Evaluation-ID:
      type: string
      description: The ID of the evaluation
      readOnly: true
      format: ulid
    Supplementary-Data-Fraud-Device:
      type: object
      description: 'Provides details of a single device fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Supplementary-Data-Fraud-Device-Data'
    Supplementary-Data-ID:
      type: object
      description: 'Provides the matching levels found for each ID element, where available.

        Match strength is scaled from 0 (no match) to 100 (full match).

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-ID-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Indicator-ID:
      type: string
      readOnly: true
      format: ulid
      description: Indicator ID that identifies an indicator from a check on an activity
    Supplementary-Data-AML-RelatedParties:
      type: object
      description: 'Defines the name and relationship of individuals or organizations related to the matched entity.

        '
      properties:
        name:
          type: string
          description: The name of the related individual or organization.
        relationship:
          type: string
          description: 'The nature of the relationship to the matched entity.

            For example: "Sibling", "Director", "Known associate".

            '
    Process-Risk-Factor-Value:
      type: object
      description: Risk Factor Value
      required:
      - factor
      - value
      properties:
        factor:
          type: string
          description: Name of the risk factor.
        value:
          type: string
          description: Supplier/service provided value that Frankie will plug into the risk engine to determine a score.
    Supplementary-Data-KYC-Gender:
      type: object
      description: 'Defines the matching results for a gender check. This is rarely used.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-KYC-Gender-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
          wasNameMatchStrongEnough:
            description: 'Indicates whether there was a sufficiently strong name match at the time this was checked, even if the gender was a perfect match.

              This is only an indicator at the time the PRO was created. Subsequent checks that reuse this result may interpret this differently.

              '
            type: boolean
    Device-ID:
      type: string
      description: ID of the device
      readOnly: true
      format: ulid
    Supplementary-Data-Base:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: "The type of supplementary data. Possible values:\n  - AML\n  - KYC_ADDRESS\n  - KYC_DOB\n  - KYC_GENDER\n  - KYC_NAME\n  - ID\n  - VISA\n  - NAME_VALIDATION\n  - KYB_ORGANIZATION\n  - MATCHLIST\n  - DUPLICATE\n  - FRAUD_DEVICE\n  - FRAUD_EMAIL\n  - FRAUD_PHONE\n  - FRAUD_LOOKUP\n  - ACTIVITY_AML\n  - ACTIVITY_DEVICE\n  - ACTIVITY_FRAUD\n"
          enum:
          - AML
          - KYC_ADDRESS
          - KYC_DOB
          - KYC_GENDER
          - KYC_NAME
          - ID
          - VISA
          - NAME_VALIDATION
          - KYB_ORGANIZATION
          - MATCHLIST
          - DUPLICATE
          - FRAUD_DEVICE
          - FRAUD_EMAIL_ADDRESS
          - FRAUD_PHONE_NUMBER
          - FRAUD_IP_ADDRESS
          - FRAUD_LOOKUP
          - ACTIVITY_AML
          - ACTIVITY_DEVICE
          - ACTIVITY_FRAUD
    individual_pro_fraud_res:
      type: object
      required:
      - requestId
      - processResults
      properties:
        requestId:
          $ref: '#/components/schemas/Request-ID'
        processResults:
          type: array
          items:
            $ref: '#/components/schemas/Process-Result-Object'
    Supplementary-Data-IDV-ElementMap:
      type: object
      description: 'A map of IDV report elements obtained from the requested IDV service provider.


        The map keys are arbitrary strings, but where possible, should use a value from the predefined IDV Data Enums.

        Service provider connections should map supplied values to existing enums where possible.

        If there is no relevant existing match, it is acceptable to use the original service provider value as the key.

        '
      additionalProperties:
        $ref: '#/components/schemas/Supplementary-Data-IDV-Data'
    FuzzinessLevel:
      type: object
      properties:
        normalized:
          description: 'The normalized fuzziness level, if set.

            Note: This is a normalized value, NOT the one used by the service provider (see the "actual" field).

            Assumes a scale of 0.0 (exact match) to 100.0 (match anything).

            '
          type: number
          format: float
          minimum: 0
          maximum: 100
        actual:
          description: 'The actual fuzziness level as provided by the service provider, if set.

            Note: This is not a normalized value, but the original value from the provider.

            '
          type: string
    Supplementary-Data-NameValidation:
      type: object
      description: 'Details on how the native language name was verified against a dictionary of anglicized translations.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          langCode:
            type: string
            description: Language code used for translation.
          nameMatchOrder:
            type: string
            description: 'Depending on the name to be translated and how it is presented, the native language and anglicized version ordering might be mixed up. The service will try various orderings to find a match.

              The order codes represent the actual order that matched.

              Each letter combination represents *F*amily, *G*iven, and *O*ther names.

              For example, FGO means that Family, Given, and Other names matched in that order.

              '
            enum:
            - FGO
            - OFG
            - GOF
            - FOG
            - GFO
            - OGF
            - FG
            - FO
            - GF
            - OF
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Supplementary-Data-KYC-Gender-MatchStrengths:
      type: object
      properties:
        gender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    Document-Type:
      type: string
      enum:
      - OTHER
      - DRIVERS_LICENSE
      - PASSPORT
      - VISA
      - IMMIGRATION
      - NATIONAL_ID
      - TAX_ID
      - NATIONAL_HEALTH_ID
      - CONCESSION
      - HEALTH_CONCESSION
      - PENSION
      - MILITARY_ID
      - BIRTH_CERT
      - CITIZENSHIP
      - MARRIAGE_CERT
      - DEATH_CERT
      - NAME_CHANGE
      - UTILITY_BILL
      - BANK_STATEMENT
      - BANK_ACCOUNT
      - INTENT_PROOF
      - ATTESTATION
      - SELF_IMAGE
      - DEVICE
      - VEHICLE_REGISTRATION
      - PROOF_OF_ADDRESS
      - HOUSE_REGISTRATION
      - YELLOW_HOUSE_REGISTRATION
      - WORK_PERMIT
      - EMPLOYMENT_CERTIFICATE
      - NOTARY_PUBLIC_ID
      - EXTERNAL_ADMIN
      - CHARGES
      - PRE_ASIC
      - ANNUAL_RETURN
      - REPORT
      - TRUST_DEED
      - PARTNERSHIP_AGREEMENT
      - ADMIN_CHANGE
      - COMPANY_REPORT
      - CHECK_RESULTS
      - AVIATION_SECURITY_ID
      - MARITIME_SECURITY_ID
      description: "Valid document ID types.\n\n  - \"OTHER\": Generic document type. Unspecified.\n  - \"DRIVERS_LICENSE\": Driver's license.\n  - \"PASSPORT\": Passport.\n  - \"VISA\": Visa document (not Visa payment card).\n  - \"IMMIGRATION\": Immigration card.\n  - \"NATIONAL_ID\": Any national ID card.\n  - \"TAX_ID\": Any national tax identifier.\n  - \"NATIONAL_HEALTH_ID\": Any national health program ID card (e.g., Medicare, NHS).\n  - \"CONCESSION\": State-issued concession card.\n  - \"HEALTH_CONCESSION\": State-issued health-specific concession card.\n  - \"PENSION\": State-issued pension ID.\n  - \"MILITARY_ID\": Military ID.\n  - \"BIRTH_CERT\": Birth certificate.\n  - \"CITIZENSHIP\": Citizenship certificate.\n  - \"MARRIAGE_CERT\": Marriage certificate.\n  - \"DEATH_CERT\": Death certificate.\n  - \"NAME_CHANGE\": Name change confirmation.\n  - \"UTILITY_BILL\": Regulated utility bill, such as electricity, gas, etc.\n  - \"BANK_STATEMENT\": Bank/card statement.\n  - \"BANK_ACCOUNT\": Bank account.\n  - \"INTENT_PROOF\": Proof of intent, generally a photo/video or a scanned letter.\n  - \"ATTESTATION\": Document of attestation (e.g., Statutory Declaration).\n\n  NOTE: These cannot be used as a supporting document:\n  - \"SELF_IMAGE\": A \"selfie\" used for comparisons.\n  - \"DEVICE\": Device ID.\n  - \"VEHICLE_REGISTRATION\": Vehicle registration number.\n  - \"PROOF_OF_ADDRESS\": Any document that provides proof of address.\n  - \"HOUSE_REGISTRATION\": House registration document.\n  - \"YELLOW_HOUSE_REGISTRATION\": Yellow House Registration Thor Ror 13.\n  - \"WORK_PERMIT\": Work permit.\n  - \"EMPLOYMENT_CERTIFICATE\": Certificate of employment.\n  - \"NOTARY_PUBLIC_ID\": Notary Public Identification.\n\n  Business-related documentation:\n\n  - \"EXTERNAL_ADMIN\": Details of appointed administrator.\n  - \"CHARGES\": Details of any charges laid against a company or director.\n  - \"PRE_ASIC\": Any documents that are Pre-ASIC.\n  - \"ANNUAL_RETURN\": Details of a company's annual return.\n  - \"REPORT\": Frankie-generated report.\n  - \"TRUST_DEED\": Corporate trust deed.\n  - \"PARTNERSHIP_AGREEMENT\": Partnership agreement documents.\n  - \"ADMIN_CHANGE\": Change of administrator.\n  - \"COMPANY_REPORT\": Registry-filed company reports.\n\n  Special document types:\n\n  - \"CHECK_RESULTS\": Special document type for specifying results of checks completed other than through Frankie.\n  - \"AVIATION_SECURITY_ID\": Aviation Security Identification Card.\n  - \"MARITIME_SECURITY_ID\": Maritime Security Identification Card."
    Process-Result-Manual-StatusEnum-KYC:
      type: string
      enum:
      - PASS
      - FAIL
      description: 'Any manual status set after the results have been reviewed.

        - PASS: When the result is determined to be a pass and no further action is needed.

        - FAIL: When the result is determined to be a fail and no further action is needed.

        '
    Device-Properties:
      type: object
      description: Device properties
      properties:
        deviceId:
          $ref: '#/components/schemas/Device-ID'
        sourceId:
          type: string
          description: The source from where a specific information was sourced from. This is a link to an informationSource object in the informationSources map.
        providerName:
          type: string
          description: The name of the provider
        externalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/External-Reference-Information'
        os:
          type: string
          description: the device operating system
        trueOs:
          type: string
          description: the true OS of the device
        firstSeenAt:
          type: string
          format: date-time
          description: the first time the device was seen in the provider network
        browser:
          type: string
          description: the device browser (if relevant)
        platform:
          type: string
          description: the device platform
        model:
          type: string
          description: the device model
        fingerprint:
          type: string
          description: the device fingerprint
        fingerprintConfidence:
          type: number
          description: the confidence of the fingerprint
    Process-Result-Manual-StatusEnum:
      allOf:
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-AML'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-KYC'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-IDV'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-Duplicate'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-Matchlist'
    Supplementary-Data-IDV-Data:
      type: object
      description: 'Contains information about a specific matched IDV element.

        '
      properties:
        originalName:
          type: string
          description: The name of the element as returned by the provider, before normalization (e.g., 'face', 'dob', 'name').
        confidence:
          type: number
          format: float
          description: Service provider's confidence in this value.
        confidenceThreshold:
          type: number
          format: float
          description: Configured confidence threshold for this value to be considered valid.
        originalData:
          type: string
          description: The raw data returned by the provider.
        reviewedData:
          type: string
          description: If the applicant was given a chance to correct the data, this is the reviewed data with any changes.
        resultNormalized:
          type: string
          description: The final result after applying confidence and normalization (e.g., clear, suspected, rejected).
        description:
          type: string
          description: A description of the data element returned in the rawData field.
    Supplementary-Data-Base-MatchStrength:
      type: integer
      description: 'Represents the standard match strength, scaled from 0 (no match) to 100 (exact match).

        In some cases, a value of 50 may be interpreted as a "partial" match.

        '
      format: int32
      minimum: 0
      maximum: 100
    Supplementary-Data-Fraud-IP-Address-Data:
      type: object
      description: 'Defines the details of a single fraud check for IP address related data.

        '
      properties:
        deviceId:
          $ref: '#/components/schemas/Device-ID'
        ipAddressInformation:
          $ref: '#/components/schemas/IP-Information'
        session:
          $ref: '#/components/schemas/Session-Data'
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Indicator'
        riskLevel:
          $ref: '#/components/schemas/Risk-Level'
        reference:
          $ref: '#/components/schemas/Result-Reference'
    Supplementary-Data-IDV-Document:
      type: object
      description: 'Result of a document check, indicating how likely or accurate the presented document is a valid ID document.


        For resultMap keys, use the keys found in the enum: SupplementaryDataIDVEnumDataDocument.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-IDV-Base'
      - type: object
        properties:
          attachmentIds:
            type: object
            description: The IDs of the document images that were analyzed.
            properties:
              front:
                type: string
                format: uuid
                description: The ID of the front image of the document.
              back:
                type: string
                format: uuid
                description: The ID of the back image of the document.
          detectedDocumentType:
            $ref: '#/components/schemas/Document-Type'
          detectedDocumentCountry:
            type: string
            description: The ISO-3166-alpha3 country code of the document as detected.
            example: AUS
    Supplementary-Data-AML-MatchData-Country:
      type: object
      required:
      - code
      description: 'Represents the country code and match type for an AML (Anti-Money Laundering) country match.

        '
      properties:
        code:
          type: string
          maxLength: 3
          description: 'The ISO 3166-1 alpha-3 country code where a match was identified.

            '
        matchType:
          type: string
          description: "The type of match associated with this country. Possible values include:\n  - CITIZENSHIP\n  - RESIDENCE\n  - BIRTH\n  - NATIONALITY\n  - INCORPORATION (for organizations)\n  - OPERATION\n"
    Error:
      type: object
      x-examples:
        '400':
          requestId: 0123456789ABCDEFGHIJKLMNOP
          errorCode: API-0400
          errorMsg: Parsing credentials from "<invalid>" failed, because invalid.
          httpStatusCode: 400
        '401':
          requestId: 0123456789ABCDEFGHIJKLMNOP
          errorCode: API-0401
          errorMsg: Unauthenticated due to invalid credentials.
          httpStatusCode: 401
        '409':
          requestId: 0123456789ABCDEFGHIJKLMNOP
          errorCode: API-0409
          errorMsg: Conflict.
          httpStatusCode: 409
      allOf:
      - $ref: '#/components/schemas/Error-Base'
      - type: object
        properties:
          requestId:
            $ref: '#/components/schemas/Request-ID'
    Supplementary-Data-IDV-OCR-Comparison-Enum-Comparison-Source:
      type: string
      description: 'Indicates the source of the data used for comparison with the OCR scan results.

        The source can be either the original entity data or the updated data extracted from the OCR scan.

        '
      enum:
      - ENTITY
      - OCR_UPDATE
    Supplementary-Data-KYC-Name-MatchStrengths:
      type: object
      properties:
        fullName:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        familyName:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        givenName:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        otherNames:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        firstInitialFamilyName:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    Process-Result-StateEnum:
      type: string
      readOnly: true
      description: Denotes the final disposition of this element's check result
      enum:
      - IN_PROGRESS
      - COMPLETED
      - TIMEOUT
      - ERROR
    Supplementary-Data-AML-MatchData-NationalId:
      type: object
      description: 'Provides details of a matched identification document, if supplied.

        '
      properties:
        idNumber:
          type: string
          description: The matched identification number.
        idType:
          type: string
          description: The type of identification matched (e.g., National ID, passport).
        idExpiry:
          type: string
          description: The expiry date of the identification document (if known), using the format provided by the service provider.
        issuingCountryCode:
          type: string
          description: The ISO 3166-1 alpha-3 country code of the issuing country.
        documentId:
          type: string
          description: The document ID if this was matched to a FrankieOne document record.
    Matchlist-Action:
      type: string
      description: "Default action recommended for a match. The action can be one of the following:\n  - `BLOCK`: Recommended action is to block the entity.\n  - `ALERT`: Recommended action is to create an alert for the entity.\n  - `ALLOW`: Recommended action is to allow the entity.\n  - `REVIEW`: Recommended action is to review the entity.\n  - `NONE`: No action; only use the `riskFactor` if any."
      enum:
      - BLOCK
      - ALERT
      - ALLOW
      - REVIEW
      - NONE
    Search-Confidence:
      type: number
      format: float
      minimum: 0
      maximum: 1
      description: 'Confidence level of the search result, represented as a number between 0 and 1.

        A higher value indicates greater confidence in the accuracy of the search result.

        '
    Supplementary-Data-IDV-OCR:
      type: object
      description: 'Result of a document OCR comparison. This object represents the comparison between scanned data (via OCR) and updated or alternately supplied results.


        For the resultMap keys, use the keys defined in the enum: SupplementaryDataIDVEnumDataOCR.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-IDV-Base'
      - type: object
        properties:
          scannedDocumentId:
            type: string
            format: uuid
            description: 'The documentId of the ID document on which OCR extraction was performed.

              '
          scannedAttachmentFrontId:
            type: string
            format: uuid

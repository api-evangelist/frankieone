      - MATCHLIST
    Risk-Level:
      type: string
      enum:
      - UNKNOWN
      - LOW
      - MEDIUM
      - HIGH
      - UNACCEPTABLE
      description: "The risk level classification:\n  - UNKNOWN: Risk level is not determined.\n  - LOW: Low risk.\n  - MEDIUM: Medium risk.\n  - HIGH: High risk.\n  - UNACCEPTABLE: Risk level is unacceptable.\n"
    Supplementary-Data-IDV-OCR-Comparison:
      type: object
      description: 'Result of an OCR and updated data comparison. This object represents the comparison between scanned data (via OCR) and updated or alternately supplied results.


        When selecting data for comparison, preference is given to the entity details that have been or will be sent to service providers for verification, rather than the updated data provided in the OCR scan.


        For the resultMap and mismatchMap keys, use the keys defined in the enum: SupplementaryDataIDVEnumDataOCRComparison.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-IDV-Base'
      - type: object
        properties:
          ocrResultId:
            type: string
            format: uuid
            description: 'The proId of the OCR data PRO used for this comparison.

              '
          comparisonSource:
            $ref: '#/components/schemas/Supplementary-Data-IDV-OCR-Comparison-Enum-Comparison-Source'
          mismatchMap:
            $ref: '#/components/schemas/Supplementary-Data-IDV-ElementMap'
            description: 'Map of OCR mismatches between previously entered or expected values and the OCR result.


              Actual matches should be recorded in resultMap.

              '
          nameId:
            type: string
            format: uuid
            description: 'The nameId of the name object used in the comparison.

              '
          dobId:
            type: string
            format: uuid
            description: 'The dobId of the date of birth object used in the comparison.

              '
    Individual-Relationships:
      type: object
      readOnly: true
      properties:
        duplicates:
          type: array
          description: 'List of duplicates for this individual. To determine which entity was marked as a duplicate,

            refer to the entity state of the relevant duplicate or reconcile using the process results.

            '
          items:
            $ref: '#/components/schemas/Relationship'
    GenderEnum:
      type: string
      enum:
      - MALE
      - FEMALE
      - NON_BINARY
      - OTHER
      - UNSPECIFIED
    Process-Result-ClassEnum:
      type: string
      description: Provides additional clarity for the result class, especially for more generic element types like 'person'.
      enum:
      - KYC
      - ID
      - IDV
      - AML
      - FRAUDLIST
      - FRAUDCHECK
      - FRAUD
      - DEVICE
      - MOBILE
      - EMAIL
      - LOOKUP
      - CREATE
      - UPDATE
      - DELETE
      - KYB
      - DUPLICATE
      - BLOCKLIST
      - SUPPORTING_DOC
      - MATCHLIST
      - VISA
      - ACTIVITY
      readOnly: true
    IDV-OCR-Response:
      type: object
      description: OCR response
      properties:
        status:
          type: string
          example: COMPLETE_OCR
          description: 'Status of the OCR process. Status can be one of:

            - AWAITING_OCR_RESULTS_PROVIDER_OFFLINE - the provider is offline and the OCR results are not available

            - AWAITING_DOCUMENT_UPLOAD_INVALID_TYPE  - the document type is not supported, mostly only passport, driving license and national id are supported but this is provider specific

            - WAITING_DOCUMENT_UPLOAD_FAILED_OCR - the document upload failed to the provider

            - AWAITING_DOCUMENT_OCR - the document is being processed by the provider still and it awaiting results

            - DOCUMENT_INVALID_EXCEEDED_SIZE_LIMIT - the document is too large to be processed

            - DOCUMENT_INVALID_INCORRECT_FILE_FORMAT - the document is not a supported file format, mostly only jpeg and png are supported but this is provider specific

            - AWAITING_DOCUMENT_UPLOAD_BACK - the back of the document needs to be uploaded

            - AWAITING_DOCUMENT_UPLOAD_FRONT - the front of the document needs to be upload

            - COMPLETE_OCR - document OCR is valid and completed

            '
          enum:
          - AWAITING_OCR_RESULTS_PROVIDER_OFFLINE
          - AWAITING_DOCUMENT_UPLOAD_INVALID_TYPE
          - WAITING_DOCUMENT_UPLOAD_FAILED_OCR
          - AWAITING_DOCUMENT_OCR
          - DOCUMENT_INVALID_EXCEEDED_SIZE_LIMIT
          - DOCUMENT_INVALID_INCORRECT_FILE_FORMAT
          - AWAITING_DOCUMENT_UPLOAD_BACK
          - AWAITING_DOCUMENT_UPLOAD_FRONT
          - COMPLETE_OCR
        individual:
          $ref: '#/components/schemas/Individual'
        requestId:
          $ref: '#/components/schemas/Request-ID'
        ocrResult:
          $ref: '#/components/schemas/Process-Result-Object'
    Entity-Type:
      type: string
      enum:
      - INDIVIDUAL
      - ORGANIZATION
      - UNKNOWN
      description: The type of entity within Frankie. This can be "INDIVIDUAL", "ORGANIZATION", or "UNKNOWN".
      readOnly: true
    Process-Result-Manual-StatusEnum-Duplicate:
      type: string
      enum:
      - FALSE_POSITIVE
      - TRUE_POSITIVE_ACCEPT
      - TRUE_POSITIVE_REJECT
      description: 'Manual review status options for duplicate entity resolution. Used to indicate the outcome of a manual duplicate check between an existing entity (A) and an incoming entity (B):

        - FALSE_POSITIVE: Entities are not duplicates. Both Entity A and Entity B are distinct and should be retained as separate records.

        - TRUE_POSITIVE_ACCEPT: Entities are duplicates. Keep the incoming entity (Entity B) as the primary record and mark the existing entity (Entity A) as the duplicate. Use when the incoming record is more accurate or complete.

        - TRUE_POSITIVE_REJECT: Entities are duplicates. Keep the existing entity (Entity A) as the primary record and mark the incoming entity (Entity B) as the duplicate. Use when the existing record is more trusted or complete.

        '
    Document-Supplementary-Data-Passport:
      type: object
      description: Supplementary information relevant to a national health id.
      allOf:
      - $ref: '#/components/schemas/Document-Supplementary-Data-Base'
      - type: object
        properties:
          homeCountryFullName:
            type: string
            description: The original name from the home country of passport.
            example: 张伟明
    Result-Reference:
      type: object
      properties:
        name:
          type: string
          description: The source of the result (e.g. sardine)
        type:
          $ref: '#/components/schemas/Result-Reference-Type'
        reference:
          type: string
          description: "A link or reference to the source of the result. \nThe format will depend on the source and the reference type.\n"
    Document-Attachment-Retrieval-Status:
      type: string
      readOnly: true
      enum:
      - NORMAL
      - EXCLUDED
      - FAILED
      description: "The reason why the data in a response is missing.\n\n- \"NORMAL\": The data was retrieved and is included. If it is empty, then\n  it was never provided or was provided empty.\n\n- \"EXCLUDED\": The retrieval request was not for 'full' data, or the object\n  has been deleted, so the data is not included.\n\n- \"FAILED\": The data could not be retrieved from the secure document\n  store.\n\nThe retrievalStatus enum will not usually be set in a request. If an\nattachment in a response has a 'FAILED' retrieval state, then\nthat object should not be sent back in a future update. It should\neither be omitted or the original data should be resent if it is available\nfrom another source. However, it is safe to send the object in an update\nwith the state received in a response. Any state other than 'NORMAL' (or\n'') will cause the blank data to be ignored, but other fields in the\nobject will be updated if needed."
    Comment:
      type: object
      properties:
        commentId:
          type: string
          description: Unique identifier for the comment.
          example: 55fc5d54-46f7-49c8-bf78-e07ec79cd6e7
          readOnly: true
        text:
          type: string
          description: The text content of the comment.
          example: Update after speaking to customer over the phone directly.
    Address-TypeEnum:
      type: string
      default: OTHER
      enum:
      - OTHER
      - RESIDENTIAL
      - BUSINESS
      - POSTAL
      - REGISTERED_OFFICE
      - PLACE_OF_BUSINESS
      - OFFICIAL_CORRESPONDANCE
      - PLACE_OF_BIRTH
      - OFFICE_LOCALITY
    Supplementary-Data-IDV-Facial-Liveness:
      type: object

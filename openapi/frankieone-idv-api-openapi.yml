          description: the device operating system
        trueOs:
          type: string
          description: the true OS of the device
        firstSeenAt:
          type: string
          format: date-time
          description: the first time the device was seen in the provider network
        browser:
          type: string
          description: the device browser (if relevant)
        platform:
          type: string
          description: the device platform
        model:
          type: string
          description: the device model
        fingerprint:
          type: string
          description: the device fingerprint
        fingerprintConfidence:
          type: number
          description: the confidence of the fingerprint
    Process-Result-Manual-StatusEnum:
      allOf:
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-AML'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-KYC'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-IDV'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-Duplicate'
      - $ref: '#/components/schemas/Process-Result-Manual-StatusEnum-Matchlist'
    Supplementary-Data-IDV-Data:
      type: object
      description: 'Contains information about a specific matched IDV element.

        '
      properties:
        originalName:
          type: string
          description: The name of the element as returned by the provider, before normalization (e.g., 'face', 'dob', 'name').
        confidence:
          type: number
          format: float
          description: Service provider's confidence in this value.
        confidenceThreshold:
          type: number
          format: float
          description: Configured confidence threshold for this value to be considered valid.
        originalData:
          type: string
          description: The raw data returned by the provider.
        reviewedData:
          type: string
          description: If the applicant was given a chance to correct the data, this is the reviewed data with any changes.
        resultNormalized:
          type: string
          description: The final result after applying confidence and normalization (e.g., clear, suspected, rejected).
        description:
          type: string
          description: A description of the data element returned in the rawData field.
    Document-Attachment-Side:
      type: string
      enum:
      - FRONT
      - BACK
      description: Indicates whether the attachment is the front or back side of a document.
    Supplementary-Data-Base-MatchStrength:
      type: integer
      description: 'Represents the standard match strength, scaled from 0 (no match) to 100 (exact match).

        In some cases, a value of 50 may be interpreted as a "partial" match.

        '
      format: int32
      minimum: 0
      maximum: 100
    Document-Attachment-ID:
      type: string
      format: uuid
      description: When a document attachment is created or uploaded, it is assigned an attachmentId. This identifier will appear in a successful response or accepted response. It can be referenced in subsequent calls if you are uploading additional or updated data.
    Supplementary-Data-Fraud-IP-Address-Data:
      type: object
      description: 'Defines the details of a single fraud check for IP address related data.

        '
      properties:
        deviceId:
          $ref: '#/components/schemas/Device-ID'
        ipAddressInformation:
          $ref: '#/components/schemas/IP-Information'
        session:
          $ref: '#/components/schemas/Session-Data'
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Indicator'
        riskLevel:
          $ref: '#/components/schemas/Risk-Level'
        reference:
          $ref: '#/components/schemas/Result-Reference'
    IDV-InitProcess-Response:
      type: object
      description: Init Process Response, used after retrieval of IDV reports from a provider. For providers that support it, this will synchronously report all report results from the provider. For providers that do not support synchronous reporting, this will request the reports and return a request id and status. The status can be polled for the final result or sent via webhook
      properties:
        status:
          type: string
          example: COMPLETE
          description: 'Status of the process. Status can be one of:

            - IN_PROGRESS - the provider has been sent the request and is currently still processing the result

            - CHECK_PROCESSING_DOWNLOAD_FAIL  - the provider has been sent the request and is currently still processing the result, there was an issue downloading the images that will be retried later automatically

            - WAITING_SELFIE_UPLOAD - the selfie has not been uploaded yet by the applicant, still awaiting applicant action

            - CHECK_PROCESSING - the provider has been sent the request and is currently still processing the result

            - DOCUMENT_INVALID_EXCEEDED_SIZE_LIMIT - the document is too large to be processed

            - DOCUMENT_INVALID_INCORRECT_FILE_FORMAT - the document is not a supported file format, mostly only jpeg and png are supported but this is provider specific

            - PROVIDER_OFFLINE - the provider is not available for processing the request

            - COMPLETE - process is valid and completed

            '
          enum:
          - IN_PROGRESS
          - CHECK_PROCESSING_DOWNLOAD_FAIL
          - WAITING_SELFIE_UPLOAD
          - CHECK_PROCESSING
          - DOCUMENT_INVALID_EXCEEDED_SIZE_LIMIT
          - DOCUMENT_INVALID_INCORRECT_FILE_FORMAT
          - PROVIDER_OFFLINE
          - COMPLETE
        requestId:
          $ref: '#/components/schemas/Request-ID'
        workflowExecutionId:
          type: string
          description: If a workflow was run as part of the processing, this is the workflow execution id
        ocrResult:
          $ref: '#/components/schemas/Process-Result-Object'
    Supplementary-Data-IDV-Document:
      type: object
      description: 'Result of a document check, indicating how likely or accurate the presented document is a valid ID document.


        For resultMap keys, use the keys found in the enum: SupplementaryDataIDVEnumDataDocument.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-IDV-Base'
      - type: object
        properties:
          attachmentIds:
            type: object
            description: The IDs of the document images that were analyzed.

        '
      required:
      - objectId
      - objectType
      properties:
        objectId:
          type: string
          description: Unique identifier of the matched object.
        objectType:
          $ref: '#/components/schemas/Object-Type'
        matchedAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Matchlist-Attribute'
    Matchlist-Entry-Base:
      type: object
      description: Basic details about a matchlist entry, excluding metadata.
      properties:
        entryId:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the matchlist entry.
        entityId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: The entity ID from which the attributes of this entry are derived. This is optional and can be used to link the matchlist entry to an entity.
        entityType:
          $ref: '#/components/schemas/Entity-Type'
          description: The type of entity from which the attributes of this entry are derived. This is optional and can be used to link the matchlist entry to an entity.
        reference:
          type: string
          description: Optional reference describing the context of this entry.
          example: CERT-BAD-ACTOR-1234-5678
        reasons:
          description: The reasons for the matchlist entry. These codes will be translated to configured description strings.
          type: array
          items:
            $ref: '#/components/schemas/Matchlist-Entry-Reason-Code'
    Supplementary-Data-Duplicate-MatchedRule:
      type: object
      description: 'Provides details about the rule that was matched to classify the object as a duplicate.

        '
      properties:
        name:
          type: string
          description: The name of the matched rule.
        strength:
          type: string
          description: "The strength of the match. This is free-form, but it is recommended to use standard values for clarity, such as:\n  - \"VERY_LOW\"\n  - \"LOW\"\n  - \"MEDIUM\"\n  - \"HIGH\"\n  - \"VERY_HIGH\"\n"
    IDV-OCR-Request:
      type: object
      description: OCR request, used to submit an image of an identity document for OCR processing. The image can be uploaded via a vendor SDK after calling get IDV token, or can be submitted directly as a fileData.
      properties:
        digital:
          description: Is this a digital version of the id, eg Digital Driver Licence screenshot. If not provided assumed to be false.
          type: boolean
        documentId:
          description: document id if known that the scan data should be attached to
          type: string
        fileData:
          $ref: '#/components/schemas/Document-Attachment'
        token:
          description: if the image was captured via a provder SDK, pass through the token instead of the fileData
          example: 41cf9401f0f889616bef
          type: string
    Supplementary-Data-KYC-Address:
      type: object
      description: 'Defines the matching levels for each address element, where available.

        Provides a match strength score ranging from 0 (no match) to 100 (full match).

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-KYC-Address-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
          wasNameMatchStrongEnough:
            description: 'Indicates whether there was a sufficiently strong name match at the time this was checked, even if the address was a perfect match.

              This is only an indicator at the time the PRO was created. Subsequent checks that reuse this result may interpret this differently.

              '
            type: boolean
    Address-Place-Of-Birth:
      type: object
      required:
      - country
      description: The country or address where the individual was born.
      properties:
        addressId:
          type: string
          description: As addresses are added to an entity, they are assigned an ID to assist with tracking.
          example: 6ad15f64-5717-4562-b3fc-2c963f66abf9
          readOnly: true
        sourceId:
          type: string
          readOnly: true
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          example: 1da65f64-5717-4562-b3fc-2c963f669fba
        longForm:
          type: string
          description: 'In some cases, the address will need to be supplied in "long form", such as when it is determined from a document scan, or is unparsable in some way.

            The service will attempt to convert it to its constituent parts where possible.

            WARNING: Use of longForm is not guaranteed to produce perfect results, due to the variety of potential formats. You have been warned.

            Failure to break down or disambiguate the address will result in an error.'
          example: 525 Kent Dr, Harlem NY 10037, USA
        unstructuredLongForm:
          type: string
          readOnly: true
          description: Raw, unformatted address as provided by the source. Not normalized or standardized.
          example: 3A/525 KENT DRIVE HARLEM NEW YORK 10036 USA
        unitNumber:
          type: string
          description: Unit/Apartment/Flat/Suite/etc. number
          example: 3A
        buildingName:
          type: string
          description: The name of the building, apartment block, condominium, etc.
          example: EQ Tower
        streetName:
          type: string
          description: 'The name of the street.

            This field should ideally contain only the street name, without the street number or street type. In some cases, especially when auto-populated by external services (e.g., Google), it may include additional address components.

            For best results, keep the street name separate from the street number and street type. See https://apidocs.frankiefinancial.com/docs/working-with-addresses for more details.'
          example: Kent
        streetNumber:
          type: string
          description: The number assigned to the property on the street. Typically a number, but can also be alphanumeric (e.g., 3A).
          example: '525'
        streetType:
          type: string
          description: The street type, such as Road, Street, Avenue, Circuit, etc.
          example: Dr
        neighborhood:
          type: string
          description: The neighborhood or suburb within the town or city. Use this only if you require both a suburb and a locality/town/city; otherwise, use the "locality" parameter.
          example: Harlem
        locality:
          type: string
          description: The locality, borough, town, village, or city.
          example: Manhattan
        district:
          type: string
          description: The district, region, county, province, or cantonment.
          example: New York County
        subdivision:
          type: string
          description: The ISO 3166-2 alphanumeric code of the administrative area/state/sub-division, minus the country code, e.g., VIC (Victoria) or TX (Texas).
          example: NY
        country:
          type: string
          description: 'The ISO 3166-1 alphanumeric three-letter code of the country, e.g., AUS, USA, IDR, KOR, etc.

            For more details, refer to: https://en.wikipedia.org/wiki/ISO_3166-1'
          example: USA
        postalCode:
          type: string
          description: The postal, zip, or pin code of the address.
          example: '10037'
    Process-Result-Manual-StatusEnum-IDV:
      type: string
      enum:
      - CLEAR
      - REJECTED
      description: 'Any manual status set after the results have been reviewed.

        - CLEAR: When the result is determined to be clear and no further action is needed.

        - REJECTED: When the result is determined to be rejected and no further action is needed.

        '
    Supplementary-Data-AML:
      type: object
      required:
      - serviceProvider
      description: 'Each AML match/hit generates a PRO, and this object describes the details of the matched individual or business.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          serviceProvider:
            type: string
            description: 'The name of the service provider from which this matched record was retrieved.

              '
          searchId:
            type: string
            description: 'The service provider''s search reference number, usually used to refer to an ongoing search.

              '
          caseId:
            type: string
            description: 'If the service provider has case management facilities, this is their case identifier. May be the same as the search ID.

              '
          referenceId:
            type: string
            description: 'An additional reference number provided by the service provider, or our own reference number.

              '
          originalStepSearchLevel:
            type: string
            description: 'Indicates if this was a simple PEP or PEP media check that found this match. Used to determine if more information is needed when re-using existing results.

              '
          groupingId:
            type: string
            description: 'Some matches can be grouped together as part of a collection of searches. This can be the searchId or a reference ID.

              '
          reportUrl:
            type: string
            format: uri
            description: 'If the service provider supplies a pre-packaged report that can be downloaded independently, this is the URL to retrieve it.

              '
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
          matchData:
            $ref: '#/components/schemas/Supplementary-Data-AML-MatchData'
          aliases:
            type: array
            items:
              type: string
              description: Alternative names, aliases, "AKA"s, or names as spelled in other languages, etc.
          relatedParties:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-RelatedParties'
          referenceDocs:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
          notes:
            $ref: '#/components/schemas/Custom-Attributes'
          pepData:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-AML-PEPData'
          sanctionData:
            type: array
            items:

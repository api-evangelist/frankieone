      - BUDDHIST
      - DISCORDIAN
      - GREGORIAN
      - HEBREW
      - ISLAMIC
      - JULIAN
      - LUNAR
      - MESO_AMERICAN
      - PERSIAN
      - OTHER
      description: The calendar system used for the date, e.g., BUDDHIST, DISCORDIAN, GREGORIAN, HEBREW, ISLAMIC, JULIAN, LUNAR, MESO_AMERICAN, PERSIAN, or OTHER.
    Phone-Number:
      type: object
      properties:
        phoneNumberId:
          $ref: '#/components/schemas/Phone-Number-ID'
        isPreferred:
          type: boolean
          example: true
          description: Indicates whether this is the individual's preferred phone number.
        type:
          type: string
          enum:
          - OTHER
          - WORK
          - HOME
          - MOBILE
          - BUSINESS
          - FAX
          description: The type of phone number.
          example: MOBILE
        sourceId:
          type: string
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          example: 14fd5f64-5717-4562-b3fc-2c963f66ba34
          readOnly: true
        country:
          type: string
          description: ISO-3166-1 alpha-3 country code.
          example: AUS
        number:
          type: string
          description: The phone number.
          example: 0426192340
        linkedAddresses:
          type: array
          readOnly: true
          description: If the phone number is attached to one or more addresses, the address IDs of those addresses will be present.
          items:
            type: object
            properties:
              addressId:
                description: The addressId of the linked address.
                type: string
                example: fa335f64-5717-4562-b3fc-2c963f66cf41
        unstructuredLongForm:
          type: string
          description: Used to capture free-form phone numbers or to store numbers that could not be normalized.
    Supplementary-Data-IDV-ElementMap:
      type: object
      description: 'A map of IDV report elements obtained from the requested IDV service provider.


        The map keys are arbitrary strings, but where possible, should use a value from the predefined IDV Data Enums.

        Service provider connections should map supplied values to existing enums where possible.

        If there is no relevant existing match, it is acceptable to use the original service provider value as the key.

        '
      additionalProperties:
        $ref: '#/components/schemas/Supplementary-Data-IDV-Data'
    FuzzinessLevel:
      type: object
      properties:
        normalized:
          description: 'The normalized fuzziness level, if set.

            Note: This is a normalized value, NOT the one used by the service provider (see the "actual" field).

            Assumes a scale of 0.0 (exact match) to 100.0 (match anything).

            '
          type: number
          format: float
          minimum: 0
          maximum: 100
        actual:
          description: 'The actual fuzziness level as provided by the service provider, if set.

            Note: This is not a normalized value, but the original value from the provider.

            '
          type: string
    Supplementary-Data-NameValidation:
      type: object
      description: 'Details on how the native language name was verified against a dictionary of anglicized translations.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          langCode:
            type: string
            description: Language code used for translation.
          nameMatchOrder:
            type: string
            description: 'Depending on the name to be translated and how it is presented, the native language and anglicized version ordering might be mixed up. The service will try various orderings to find a match.

              The order codes represent the actual order that matched.

              Each letter combination represents *F*amily, *G*iven, and *O*ther names.

              For example, FGO means that Family, Given, and Other names matched in that order.

              '
            enum:
            - FGO
            - OFG
            - GOF
            - FOG
            - GFO
            - OGF
            - FG
            - FO
            - GF
            - OF
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Supplementary-Data-KYC-Gender-MatchStrengths:
      type: object
      properties:
        gender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    Relationship-Origin:
      type: object
      description: Details about the process that originated the relationship.
      properties:
        entityId:
          $ref: '#/components/schemas/Entity-ID'
        entityType:
          $ref: '#/components/schemas/Entity-Type'
        processResultId:
          $ref: '#/components/schemas/Process-Result-ID'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: The date and time when the relationship origin record was created.
    IDV-Token-Request:
      type: object
      description: IDV Token Request, queries the IDV provider for a token to be used with their sdk. If there is an existing token for this given entity that isn't expired, that will be returned instead of a new token.
      properties:
        applicantId:
          description: ID of the applicant/individual in the IDV provider's system. Specify this if resuming/continuing an IDV check
          example: 412e8c806fdfb0bb19b5
          type: string
        applicationId:
          description: Reference or name of the application running this IDV check. Specify this if running this check embedded in a application rather than a web page.
          example: 94d9a75a5072444c
          type: string
        country:
          description: Country code to check for. Must be a ISO-3166 alpha-3 code entry. Only for use with providers that can restrict to a single country.
          example: AUS
          type: string
        documentType:
          description: Document type that will be used for the check. Can be one of DRIVERS_LICENCE, PASSPORT, NATIONAL_ID. . Only for use with providers that can restrict to a single document type.
          example: DRIVER_LICENCE
          type: string
        referrer:
          description: If this is for a web SDK, then you need to supply the referrer domain so that the token can be validated by the IDV service
          example: https://example.com
          type: string
        relayState:
          description: State from start of flow that should be relayed through the process via any redirects.
          example: 412e8c806fdfb0bb19b5
          type: string
        provider:
          description: What provider to use for the IDV check. This is the name of the provider as configured in the system. If not provided the default provider will be used.
          example: onfido
          type: string
        products:
          description: What product(s) for the provider to use for the IDV check. If not provided the default product for a provider will be used.
          example: idv
          type: array
          items:
            type: string
        comment:
          $ref: '#/components/schemas/Comment'
    Document-Type:
      type: string
      enum:
      - OTHER
      - DRIVERS_LICENSE
      - PASSPORT
      - VISA
      - IMMIGRATION
      - NATIONAL_ID
      - TAX_ID
      - NATIONAL_HEALTH_ID
      - CONCESSION
      - HEALTH_CONCESSION
      - PENSION
      - MILITARY_ID
      - BIRTH_CERT
      - CITIZENSHIP
      - MARRIAGE_CERT
      - DEATH_CERT
      - NAME_CHANGE
      - UTILITY_BILL
      - BANK_STATEMENT
      - BANK_ACCOUNT
      - INTENT_PROOF
      - ATTESTATION
      - SELF_IMAGE
      - DEVICE
      - VEHICLE_REGISTRATION
      - PROOF_OF_ADDRESS
      - HOUSE_REGISTRATION
      - YELLOW_HOUSE_REGISTRATION
      - WORK_PERMIT
      - EMPLOYMENT_CERTIFICATE
      - NOTARY_PUBLIC_ID
      - EXTERNAL_ADMIN
      - CHARGES
      - PRE_ASIC
      - ANNUAL_RETURN
      - REPORT
      - TRUST_DEED
      - PARTNERSHIP_AGREEMENT
      - ADMIN_CHANGE
      - COMPANY_REPORT
      - CHECK_RESULTS
      - AVIATION_SECURITY_ID
      - MARITIME_SECURITY_ID
      description: "Valid document ID types.\n\n  - \"OTHER\": Generic document type. Unspecified.\n  - \"DRIVERS_LICENSE\": Driver's license.\n  - \"PASSPORT\": Passport.\n  - \"VISA\": Visa document (not Visa payment card).\n  - \"IMMIGRATION\": Immigration card.\n  - \"NATIONAL_ID\": Any national ID card.\n  - \"TAX_ID\": Any national tax identifier.\n  - \"NATIONAL_HEALTH_ID\": Any national health program ID card (e.g., Medicare, NHS).\n  - \"CONCESSION\": State-issued concession card.\n  - \"HEALTH_CONCESSION\": State-issued health-specific concession card.\n  - \"PENSION\": State-issued pension ID.\n  - \"MILITARY_ID\": Military ID.\n  - \"BIRTH_CERT\": Birth certificate.\n  - \"CITIZENSHIP\": Citizenship certificate.\n  - \"MARRIAGE_CERT\": Marriage certificate.\n  - \"DEATH_CERT\": Death certificate.\n  - \"NAME_CHANGE\": Name change confirmation.\n  - \"UTILITY_BILL\": Regulated utility bill, such as electricity, gas, etc.\n  - \"BANK_STATEMENT\": Bank/card statement.\n  - \"BANK_ACCOUNT\": Bank account.\n  - \"INTENT_PROOF\": Proof of intent, generally a photo/video or a scanned letter.\n  - \"ATTESTATION\": Document of attestation (e.g., Statutory Declaration).\n\n  NOTE: These cannot be used as a supporting document:\n  - \"SELF_IMAGE\": A \"selfie\" used for comparisons.\n  - \"DEVICE\": Device ID.\n  - \"VEHICLE_REGISTRATION\": Vehicle registration number.\n  - \"PROOF_OF_ADDRESS\": Any document that provides proof of address.\n  - \"HOUSE_REGISTRATION\": House registration document.\n  - \"YELLOW_HOUSE_REGISTRATION\": Yellow House Registration Thor Ror 13.\n  - \"WORK_PERMIT\": Work permit.\n  - \"EMPLOYMENT_CERTIFICATE\": Certificate of employment.\n  - \"NOTARY_PUBLIC_ID\": Notary Public Identification.\n\n  Business-related documentation:\n\n  - \"EXTERNAL_ADMIN\": Details of appointed administrator.\n  - \"CHARGES\": Details of any charges laid against a company or director.\n  - \"PRE_ASIC\": Any documents that are Pre-ASIC.\n  - \"ANNUAL_RETURN\": Details of a company's annual return.\n  - \"REPORT\": Frankie-generated report.\n  - \"TRUST_DEED\": Corporate trust deed.\n  - \"PARTNERSHIP_AGREEMENT\": Partnership agreement documents.\n  - \"ADMIN_CHANGE\": Change of administrator.\n  - \"COMPANY_REPORT\": Registry-filed company reports.\n\n  Special document types:\n\n  - \"CHECK_RESULTS\": Special document type for specifying results of checks completed other than through Frankie.\n  - \"AVIATION_SECURITY_ID\": Aviation Security Identification Card.\n  - \"MARITIME_SECURITY_ID\": Maritime Security Identification Card."
    Process-Result-Manual-StatusEnum-KYC:
      type: string
      enum:
      - PASS
      - FAIL
      description: 'Any manual status set after the results have been reviewed.

        - PASS: When the result is determined to be a pass and no further action is needed.

        - FAIL: When the result is determined to be a fail and no further action is needed.

        '
    Device-Properties:

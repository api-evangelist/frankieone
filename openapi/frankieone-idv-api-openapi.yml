openapi: 3.0.3
info:
  title: Core V2 Audit IDV API
  version: 2.0.0
  description: This is the APIs for V2 Core. It allows you to do common operations, such as read audit entries or get workflow lists.
  contact:
    name: FrankieOne
    url: https://www.frankieone.com/
    email: help@frankieone.com
servers:
- url: https://api.uat.frankie.one
security:
- Api-Key: []
tags:
- name: IDV
  description: Get a token and/or upload documents to initiate an IDV process
paths:
  /v2/individuals/{entityId}/actions/idv/token:
    parameters:
    - $ref: '#/components/parameters/entityId'
    post:
      summary: Queries the IDV provider for a token to be used with their sdk. This allows a provider SDK to be instantiated, this is to be called before starting the IDV or OCR process.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDV-Token-Request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDV-Token-Response'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid EntityId:
                  value:
                    errorCode: API-0400,
                    errorMsg: 'Multiple Errors: See Issues list'
                    details:
                    - issue: 'entityId in path must be of type uuid: "test"'
                      issueLocation: VALIDATE-entityId
                    requestId: 01HM5XJ7VASZ3EJMB1VQGTBFJ4
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid authentication:
                  value:
                    errorCode: AUTH-0002,
                    errorMsg: Unauthorized
                    details:
                    - issue: Invalid Authentication provided. Access denied.
                      issueLocation: request
                    requestId: 00000000S6MNG7624K2TDXT1E3
                No Api-Key:
                  value:
                    errorCode: AUTH-0401
                    errorMsg: Unauthorized
                    details:
                    - issue: No api key provided. Access denied.
                      issueLocation: request
                    requestId: 00000001S6MNG7624K2TDXT1E3
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getIDVToken
      description: Get an IDV Token for the given individual.
      parameters:
      - $ref: '#/components/parameters/Api-Key'
      - $ref: '#/components/parameters/X-Frankie-CustomerID'
      - $ref: '#/components/parameters/X-Frankie-CustomerChildID'
      - $ref: '#/components/parameters/X-Frankie-Channel'
      tags:
      - IDV
      security:
      - Api-Key: []
      - jwt:
        - kyc:api
  /v2/individuals/{entityId}/actions/idv/ocr:
    parameters:
    - $ref: '#/components/parameters/entityId'
    post:
      summary: Submit an identity document photo for ocr processing. Results will be in the form of an identity document with populated with ocr results.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDV-OCR-Request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDV-OCR-Response'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid EntityId:
                  value:
                    errorCode: API-0400,
                    errorMsg: 'Multiple Errors: See Issues list'
                    details:
                    - issue: 'entityId in path must be of type uuid: "test"'
                      issueLocation: VALIDATE-entityId
                    requestId: 01HM5XJ7VASZ3EJMB1VQGTBFJ4
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid authentication:
                  value:
                    errorCode: AUTH-0002,
                    errorMsg: Unauthorized
                    details:
                    - issue: Invalid Authentication provided. Access denied.
                      issueLocation: request
                    requestId: 00000000S6MNG7624K2TDXT1E3
                No Api-Key:
                  value:
                    errorCode: AUTH-0401
                    errorMsg: Unauthorized
                    details:
                    - issue: No api key provided. Access denied.
                      issueLocation: request
                    requestId: 00000001S6MNG7624K2TDXT1E3
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: processIDVOCR
      description: Submit an identity document photo for ocr processing. Results will be in the form of an identity document with populated with ocr results if successful. Status will be COMPLETE_OCR if OCR was successful and no further images are required. The image can be uploaded or captured via a vendor SDK after calling get IDV token, or can be submitted directly as a fileData.
      parameters:
      - $ref: '#/components/parameters/Api-Key'
      - $ref: '#/components/parameters/X-Frankie-CustomerID'
      - $ref: '#/components/parameters/X-Frankie-CustomerChildID'
      - $ref: '#/components/parameters/X-Frankie-Channel'
      tags:
      - IDV
      security:
      - Api-Key: []
      - jwt:
        - kyc:api
  /v2/individuals/{entityId}/actions/idv/process:
    parameters:
    - $ref: '#/components/parameters/entityId'
    post:
      summary: At the end of the IDV data capture process with all photos and videos captured, signal to IDV provider that check is ready to analyse and check.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDV-InitProcess-Request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDV-InitProcess-Response'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid EntityId:
                  value:
                    errorCode: API-0400,
                    errorMsg: 'Multiple Errors: See Issues list'
                    details:
                    - issue: 'entityId in path must be of type uuid: "test"'
                      issueLocation: VALIDATE-entityId
                    requestId: 01HM5XJ7VASZ3EJMB1VQGTBFJ4
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid authentication:
                  value:
                    errorCode: AUTH-0002,
                    errorMsg: Unauthorized
                    details:
                    - issue: Invalid Authentication provided. Access denied.
                      issueLocation: request
                    requestId: 00000000S6MNG7624K2TDXT1E3
                No Api-Key:
                  value:
                    errorCode: AUTH-0401
                    errorMsg: Unauthorized
                    details:
                    - issue: No api key provided. Access denied.
                      issueLocation: request
                    requestId: 00000001S6MNG7624K2TDXT1E3
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: initBiometrics
      description: "At the end of the IDV data capture process with all photos and videos captured, signal to IDV provider\n    that check is ready to analyse and check. If this call is successful, an entity\nis populated with with any details supplied if it doesn't not already have a name."
      parameters:
      - $ref: '#/components/parameters/Api-Key'
      - $ref: '#/components/parameters/X-Frankie-CustomerID'
      - $ref: '#/components/parameters/X-Frankie-CustomerChildID'
      - $ref: '#/components/parameters/X-Frankie-Channel'
      tags:
      - IDV
      security:
      - Api-Key: []
      - jwt:
        - kyc:api
components:
  schemas:
    Session:
      type: object
      description: Session details for an activity, this is always scoped to a singular entity.
      properties:
        token:
          type: string
          description: A token to identify the specific session for the activity
    Phone-Number-ID:
      type: string
      description: 'As phone numbers are added to an entity, they are assigned an ID to assist with tracking.

        If you are adjusting phone numbers, you will need to include the ID to reference it correctly in the list.'
      example: ad165f64-5717-4562-b3fc-2c963f66bfa9
    Supplementary-Data-Activity-Device:
      type: object
      description: 'Defines the details of an activity device result.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          riskLevel:
            type: string
          activityResults:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail'
    IDV-Token-Response:
      type: object
      description: IDV Token Response, contains the token and it's expiry, and any vendor specific parameters.
      properties:
        applicantId:
          description: The ID of the applicant attached to this check.
          type: string
        country:
          description: Country code to check for. Must be a ISO-3166 alpha-3 code entry.
          example: AUS
          type: string
        documentType:
          description: Document type that will be used for the check.
          example: DRIVER_LICENCE
          type: string
        provider:
          description: Underlying provider, used for selecting the correct SDK if not using SmartUI.
          example: OCRLabs
          type: string
        smsSent:
          description: Has a sms to the user already been sent as part of the token request
          example: true
          type: boolean
        token:
          description: Tokens are only valid for a limited time.
          example: 41cf9401f0f889616bef
          type: string
        tokenExpiry:
          description: The time at which the provided token will expire.
          type: string
          format: date-time
          example: '2020-01-01T00:00:00.000Z'
        vendorParameters:
          description: Vendor specific parameters, used for passing through additional parameters from the vendor to instantiate the SDK.
          additionalProperties:
            type: string
          example:
            tokenURL: example1.com
          type: object
        requestId:
          $ref: '#/components/schemas/Request-ID'
    Process-ResultEnum:
      type: string
      enum:
      - MATCH
      - PARTIAL_MATCH
      - INVALID_MATCH
      - NO_MATCH
      - CLEAR
      - HIT
      - BAD_DATA
      - CREATED
      - UPDATED
      - DELETED
      - FAIL
      - NOT_APPLICABLE
      - SUSPECTED
      - REJECTED
      - MANUAL
      - CLEAR_AUTO
      - OVERRIDE
      readOnly: true
      description: 'The actual pass/fail result of the element check

        - MATCH: The element check matched the expected criteria.

        - PARTIAL_MATCH: The element check partially matched the expected criteria.

        - INVALID_MATCH: The element check matched but was invalid.

        - NO_MATCH: The element check did not match the expected criteria.

        - CLEAR: The element check was cleared.

        - HIT: The element check hit a specific condition or threshold.

        - BAD_DATA: The element check encountered bad data.

        - CREATED: The element check resulted in the creation of a new record.

        - UPDATED: The element check resulted in the update of an existing record.

        - DELETED: The element check resulted in the deletion of a record.

        - FAIL: The element check failed.

        - NOT_APPLICABLE: The element check was not applicable in the given context.

        - SUSPECTED: The element check raised a suspicion but did not confirm it.

        - REJECTED: The element check was rejected.

        - MANUAL: The element check was manually reviewed or processed.

        - CLEAR_AUTO: The element check was cleared automatically.

        - OVERRIDE: The element check was overridden by a manual action or system rule.

        '
    Document-Supplementary-Data-National-ID:
      type: object
      description: Supplementary information relevant to a national ID.
      allOf:
      - $ref: '#/components/schemas/Document-Supplementary-Data-Base'
      - type: object
        properties:
          homeCountryFullName:
            type: string
            description: The original full name from the individual's home country national ID.
            example: 张伟明
          paternalFamilyName:
            type: string
            description: The individual's family name inherited from the father's side.
            example: MENDOZA
          maternalFamilyName:
            type: string
            description: The individual's family name inherited from the mother's side.
            example: GARCIA
    Supplementary-Data-Matchlist:
      type: object
      description: 'Each match against a matchlist entry generates a PRO (Process Result Object), and this object describes the details of the matched entry.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Matchlist-Entry-Base'
      - type: object
        properties:
          matchlistId:
            type: string
            format: uuid
            description: Unique identifier for the matchlist.
          matchlistName:
            type: string
            description: Unique name of the matchlist.
          matchlistAction:
            $ref: '#/components/schemas/Matchlist-Action'
          confidence:
            $ref: '#/components/schemas/Search-Confidence'
          matchedFields:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-Matchlist-Field'
    Supplementary-Data-AML-SanctionsData:
      type: object
      description: 'Contains sanction information about a specific matched entity.

        '
      properties:
        countryCode:
          type: string
          description: 'The ISO 3166-1 alpha-3 country code where the sanction entry was recorded.

            '
        countryName:
          type: string
          description: 'The ISO 3166 country name where the sanction entry was recorded.

            '
        sourceName:
          type: string
          description: 'The source of the sanction entry data.

            '
        sourceUrl:
          type: string
          format: uri
          description: 'The URL where the original sanction information can be found.

            '
        sourceReason:
          type: string
          description: 'The reason provided for sanctioning the individual or organization.

            '
        listingStart:
          type: string
          description: 'The date when the listing started. Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        listingEnd:
          type: string
          description: 'The date when the listing ended (if available or known). Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        imageUrl:
          type: string
          format: uri
          description: 'Optional URL of an image of the person or company logo of the sanctioned entity.

            '
        referenceDocs:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
        additionalData:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-AdditionalData'
    Supplementary-Data-Activity-AML:
      type: object
      description: 'Provides details of an activity Anti-Money Laundering (AML) result.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          riskLevel:
            type: string
            description: Indicates the assessed risk level for the activity.
          activityResults:
            type: array
            description: A list of detailed results for the activity AML check.
            items:
              $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail'
    Individual-Name:
      type: object
      required:
      - familyName
      x-examples:
        Example 1:
          givenName: John
          middleName: Jacob
          familyName: Smith
      properties:
        nameId:
          type: string
          example: 87654321-4321-4321-4321-210987654321
          description: Include the nameId of an existing name for this individual to modify it
          readOnly: true
        language:
          type: string
          example: eng
          description: The ISO-639-3 standard code that best represents the language and character set of the individual's name
          default: eng
        givenName:
          type: string
          example: John
          description: First name or given name
        middleName:
          type: string
          example: R
          description: Middle name(s) or middle initial(s)
        familyName:
          type: string
          example: Doe
          description: Last name, family name, or surname.
        otherName:
          type: string
          example: null
          description: Another name that this person may be known as, e.g., "Bob" as an alternative to "Robert".
        prefix:
          type: string
          example: Dr.
          description: Letters or words that come before an individual's full name (e.g., title or honorific).
        suffix:
          type: string
          example: Jr.
          description: Letters or words that come after an individual's full name (e.g., generational suffix).
        sourceId:
          type: string
          example: 87654321-4321-4321-4321-210987654322
          description: The source from where a specific information was sourced from. This is a link to an informationSource object in the informationSources map
          readOnly: true
        displayName:
          type: string
          example: John Doe
          description: Long format of the individual's full name, including any prefix, suffix, middle, or other names. Best used when the proper structure of the individual's name is unknown.
    Supplementary-Data-Fraud-IP-Address:
      type: object
      description: 'Defines the details of a single IP address fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Supplementary-Data-Fraud-IP-Address-Data'
    Process-Result-Manual-StatusEnum-AML:
      type: string
      enum:
      - TRUE_POSITIVE
      - FALSE_POSITIVE
      - TRUE_POSITIVE_ACCEPT
      - TRUE_POSITIVE_REJECT
      - UNKNOWN
      - UNKNOWN_ACCEPT
      - UNKNOWN_REJECT
      description: 'The manual status that the AML process result should be set to after the results have been reviewed.

        - FALSE_POSITIVE: The result is determined to be a false positive, but you do not necessarily want to resolve it.

        - FALSE_POSITIVE_ACCEPT: The result is determined to be a false positive and you want to resolve it. "Accept" infers you want to accept the activity.

        - TRUE_POSITIVE: The result is determined to be a true positive, but you do not necessarily want to resolve it.

        - TRUE_POSITIVE_REJECT: The result is determined to be a true positive and you want to resolve it. "Reject" infers you want to reject the activity.

        - UNKNOWN: The result is determined to be unknown, but you do not necessarily want to resolve it.

        - UNKNOWN_ACCEPT: The result is determined to be unknown and you want to resolve it. "Accept" infers you want to accept the activity.

        - UNKNOWN_REJECT: The result is determined to be unknown and you want to resolve it. "Reject" infers you want to reject the activity.

        '
    Relationship:
      type: object
      properties:
        entityId:
          $ref: '#/components/schemas/Entity-ID'
        entityType:
          $ref: '#/components/schemas/Entity-Type'
        origin:
          $ref: '#/components/schemas/Relationship-Origin'
    Likelihood:
      type: string
      description: 'Likelihood of a particular scenario

        '
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - VERY_HIGH
      - UNKNOWN
    Supplementary-Data-AML-WatchlistData:
      type: object
      description: 'Contains non-PEP/non-sanction watchlist and other source information about a specific matched entity.

        '
      properties:
        countryCode:
          type: string
          description: 'The ISO 3166-1 alpha-3 country code where the watchlist entry was recorded.

            '
        countryName:
          type: string
          description: 'The ISO 3166 country name where the watchlist entry was recorded.

            '
        sourceName:
          type: string
          description: 'The source of the watchlist entry data.

            '
        sourceUrl:
          type: string
          format: uri
          description: 'The URL where the original watchlist information can be found.

            '
        sourceReason:
          type: string
          description: 'The reason provided for adding the individual or organization to the watchlist.

            '
        listingStart:
          type: string
          description: 'The date when the listing started. Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        listingEnd:
          type: string
          description: 'The date when the listing ended (if available or known). Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        imageUrl:
          type: string
          format: uri
          description: 'Optional URL of an image of the person or company logo of the entity on this list.

            '
        referenceDocs:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
        additionalData:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-AdditionalData'
    Issue:
      type: object
      properties:
        issue:
          type: string
          description: Description of the issue.
        issueLocation:
          type: string
          description: The location or context where the issue was identified.
        issueType:
          type: string
          description: The type or category of the issue.
    Document-Supplementary-Data-Marriage-Certificate:
      type: object
      description: Supplementary information relevant to a marriage certificate.
      allOf:
      - $ref: '#/components/schemas/Document-Supplementary-Data-Base'
      - type: object
        description: Supplementary information relevant to a marriage certificate.
        properties:
          partner1GivenName:
            type: string
            description: The given name of partner 1.
            example: Harry
          partner1FamilyName:
            type: string
            description: The family name of partner 1.
            example: Versailles
          partner1OtherName:
            type: string
            description: The other name of partner 1.
            example: S.
          partner2GivenName:
            type: string
            description: The given name of partner 2.
            example: Harry
          partner2FamilyName:
            type: string
            description: The family name of partner 2.
            example: Versailles
          partner2OtherName:
            type: string
            description: The other name of partner 2.
            example: S.
          registrationDate:
            type: string
            description: The date the marriage was registered.
            example: '2023'
          marriageDate:
            type: string
            description: The date the marriage was held.
            example: '2023-10-01'
          dateOfPrint:
            type: string
            description: The date the birth certificate was printed.
            example: '2023-10-01'
    Supplementary-Data-Activity-Result-Detail-Indicator:
      type: object
      properties:
        indicatorId:
          $ref: '#/components/schemas/Indicator-ID'
        name:
          type: string
        value:
          type: string
        score:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Rule'
    Supplementary-Data-Matchlist-Attribute:
      type: object
      description: 'Information about a matched attribute within a matched field.

        '
      required:
      - type
      - confidence
      properties:
        type:
          $ref: '#/components/schemas/Matchlist-Entry-Attribute-Type'
        confidence:
          $ref: '#/components/schemas/Search-Confidence'
          description: 'Confidence score for the attribute match.

            '
    Request-ID:
      type: string
      example: 01HN9XHZN6MGXM9JXG50K59Q85
      description: The unique request identifier for the API call made.
    Supplementary-Data-Fraud-Device-Data:
      type: object
      description: 'Provides details of a single fraud check for device and related device data.

        '
      properties:
        device:
          $ref: '#/components/schemas/Device'
        session:
          $ref: '#/components/schemas/Session-Data'
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Indicator'
        riskLevel:
          $ref: '#/components/schemas/Risk-Level'
        reference:
          $ref: '#/components/schemas/Result-Reference'
    Entity-Documents:
      type: object
      properties:
        REPORT:
          type: array
          items:
            $ref: '#/components/schemas/Document-Information'
        SUPPORTING:
          type: array
          items:
            $ref: '#/components/schemas/Document-Information'
        IDENTITY:
          type: array
          items:
            $ref: '#/components/schemas/Document-Information'
        OTHER:
          type: array
          items:
            $ref: '#/components/schemas/Document-Information'
    Supplementary-Data-KYC-Address-MatchStrengths:
      type: object
      properties:
        fullAddress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetNumber:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetName:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetType:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        streetAll:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        locality:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        district:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        subdivision:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        postalCode:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        country:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    Entity-ID:
      type: string
      description: 'Entities are assigned an auto-generated UUID to ensure global uniqueness, represented as entityId. The entityId allows for precise modification when required.

        To modify an entity, set the entityId of the entity you wish to update in an update request.'
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      readOnly: true
    Supplementary-Data-AML-ReferenceDocs:
      type: object
      description: 'Captures references to source documents or websites, including the URL and, where available, a description of the original source.

        '
      properties:
        url:
          type: string
          format: uri
          description: URL of any external reference document related to this matched entity.
        description:
          type: string
          description: If a description of the document is provided, it will be included here.
    Matchlist-Entry-Reason-Code:
      type: string
      description: The reason code for the matchlist entry. This code will be translated to a configured description string. Supported codes are 1 to 24 characters long, consisting only of uppercase letters (A-Z), digits (0-9), underscores (_), or hyphens (-), with no spaces or special characters.
      pattern: ^[A-Z0-9_-]{1,24}$
    Supplementary-Data-Fraud-Email-Address:
      type: object
      description: 'Defines the details of a single email fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          emailAddressId:
            $ref: '#/components/schemas/Email-Address-ID'
          riskLevel:
            $ref: '#/components/schemas/Risk-Level'
          reference:
            $ref: '#/components/schemas/Result-Reference'
          indicators:
            type: array
            items:
              $ref: '#/components/schemas/Supplementary-Data-Activity-Result-Detail-Indicator'
    Process-Result-Object:
      type: object
      properties:
        processResultId:
          $ref: '#/components/schemas/Process-Result-ID'
        schemaVersion:
          type: integer
          readOnly: true
        entityId:
          type: string
          readOnly: true
        requestId:
          $ref: '#/components/schemas/Request-ID'
          readOnly: true
        stepName:
          type: string
          readOnly: true
        stepType:
          type: string
          readOnly: true
        objectType:
          type: string
          readOnly: true
        objectId:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        groupId:
          type: string
          readOnly: true
        providerResult:
          $ref: '#/components/schemas/Provider-Result'
        result:
          $ref: '#/components/schemas/Process-ResultEnum'
        class:
          $ref: '#/components/schemas/Process-Result-ClassEnum'
        supplementaryData:
          $ref: '#/components/schemas/Supplementary-Data'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Process-Result-Error'
          readOnly: true
        notes:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Custom-Attributes'
        systemStatus:
          $ref: '#/components/schemas/Process-Result-System-StatusEnum'
        manualStatus:
          $ref: '#/components/schemas/Process-Result-Manual-StatusEnum'
        state:
          $ref: '#/components/schemas/Process-Result-StateEnum'
        riskFactors:
          type: array
          items:
            $ref: '#/components/schemas/Process-Risk-Factor-Value'
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    Date-Base:
      type: object
      properties:
        year:
          type: string
          description: Year in "YYYY" format.
          example: '1990'
        month:
          type: string
          description: Month in "MM" format.
          example: '03'
        day:
          type: string
          description: Day in "DD" format.
          example: '27'
        unstructured:
          type: string
          description: 'Raw date format without normalization or standardization to the Gregorian calendar.

            This can be used to provide non-Gregorian dates (e.g., Islamic dates).'
          example: 12 Rajab 1445 AH
        type:
          $ref: '#/components/schemas/Date-Type'
    ConfidenceLevel:
      type: object
      properties:
        normalized:
          description: 'The normalized confidence level, if set.

            Note: This is a normalized value, NOT the one used by the service provider (see the "actual" field).

            Assumes a scale of 0.0 (exact match) to 100.0 (match anything).

            '
          type: number
          format: float
          minimum: 0
          maximum: 100
        actual:
          description: 'The actual confidence level as provided by the service provider, if set.

            Note: This is not a normalized value, but the original value from the provider.

            '
          type: string
    IP-Information:
      type: object
      description: IP information, typically in relation to a device
      properties:
        v4Address:
          type: string
          description: The IPv4 address
          format: ipv4
        v6Address:
          type: string
          description: The IPv6 address
          format: ipv6
        trueAddress:
          type: string
          description: The true IP address
        asn:
          type: string
          description: The ASN of the IP address
        connectionType:
          type: string
          description: The type of IP connection (if available)
          example:
          - Fixed Line ISP
        location:
          $ref: '#/components/schemas/Geolocation'
    Supplementary-Data-Visa:
      type: object
      description: 'Defines the Visa details returned from VEVO.

        Class and subclass values can be found on the VEVO website.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          country:
            type: string
            description: Country of origin (ISO-3166-alpha3 code).
          class:
            type: string
            description: Visa class.
          subClass:
            type: string
            description: Visa subclass.
          entitlementStatus:
            type: string
            description: Status of the visa entitlement.
          grantDate:
            type: string
            format: date
            description: Date the visa was granted.
          expiryDate:
            type: string
            format: date
            description: Date the visa expires.
          hasExpired:
            type: boolean
            description: Indicates if the visa has expired (sometimes expiry date is not returned).
          noExpiry:
            type: boolean
            description: Indicates if this visa has no expiry.
          entitlementConditionCode:
            type: string
            description: Code for the entitlement condition.
          entitlementConditionDescription:
            type: string
            description: Description of the entitlement condition.
          holderType:
            type: string
            enum:
            - PRIMARY
            - SECONDARY
            description: "Indicates if this is the primary visa holder or a secondary holder (usually a spouse/partner or other family member).\nValues:\n  - PRIMARY\n  - SECONDARY\n"
          lookupErrorCode:
            type: string
            description: If there was an error during the lookup, this is the code returned from VEVO.
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Supplementary-Data-AML-PEPData:
      type: object
      description: 'Contains Politically Exposed Person (PEP) information about a specific matched entity.

        '
      properties:
        countryCode:
          type: string
          description: 'The ISO 3166-1 alpha-3 country code where the PEP entry was recorded.

            '
        countryName:
          type: string
          description: 'The ISO 3166 country name where the PEP entry was recorded.

            '
        sourceName:
          type: string
          description: 'The source of the PEP entry data.

            '
        level:
          type: string
          description: 'The PEP "level", generally represented by a number from 1 (heads of state, military, civil service, etc.) to 4 (local government, minor public servants, etc.).

            '
        sourceUrl:
          type: string
          format: uri
          description: 'The URL where the original PEP information can be found.

            '
        sourcePosition:
          deprecated: true
          type: string
          description: '(Deprecated) The position held that created the PEP entry.

            '
        position:
          type: string
          description: 'The position held that created the PEP entry.

            '
        positionDescription:
          type: string
          description: 'A description of the position held that created the PEP entry.

            '
        status:
          type: string
          description: 'The current PEP status.

            '
        listingStart:
          type: string
          description: 'The date when the listing started. Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        listingEnd:
          type: string
          description: 'The date when the listing ended (if available or known). Will attempt to use ISO 8601 date format; otherwise, the format supplied by the source.

            '
        imageUrl:
          type: string
          format: uri
          description: 'Optional URL of an image of the person associated with their role.

            '
        referenceDocs:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-ReferenceDocs'
        additionalData:
          type: array
          items:
            $ref: '#/components/schemas/Supplementary-Data-AML-AdditionalData'
    Document-Information:
      type: object
      required:
      - type
      - country
      properties:
        documentId:
          $ref: '#/components/schemas/Document-ID'
        entityId:
          $ref: '#/components/schemas/Entity-ID'
        expiryDate:
          $ref: '#/components/schemas/Date'
          description: The expiry date of the document in YYYY-MM-DD format.
        issueDate:
          $ref: '#/components/schemas/Date'
          description: The issue date of the document in YYYY-MM-DD format.
        primaryIdentifier:
          type: string
          description: The primary ID number of the document, e.g., the ID number on a driver licence.
          example: '000734130'
        secondaryIdentifier:
          type: string
          description: The secondary ID number of the document, e.g., the card number on a driver licence.
          example: P0001975
        type:
          $ref: '#/components/schemas/Document-Type'
        subtype:
          type: string
          description: The sub-type of the document, if relevant. This can include specific report or attestation types, e.g., FACIAL_COMPARISON (attestation) or KYC (report).
          example: Photo Comparison
        subdivision:
          type: string
          description: The abbreviated ISO 3166 subdivision/region where the ID was issued, e.g., "VIC" for the Australian state of Victoria or "MA" for the US state of Massachusetts.
          example: VIC
        country:
          type: string
          maxLength: 3
          description: 'The ISO 3166 alpha-3 country code where the document was issued, if relevant.

            For more information, please refer to: https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes'
          example: AUS
        createdAt:
          type: string
          format: date-time
          description: The date and time when the document record was created, in ISO 8601 format.
          example: '2024-01-15T02:18:11.365Z'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: The date and time when the document record was last updated, in ISO 8601 format.
          example: '2025-01-16T02:18:11.365Z'
          readOnly: true
        validFrom:
          $ref: '#/components/schemas/Date'
          description: The date when the validity period for this document began, if applicable.
        validTo:
          $ref: '#/components/schemas/Date'
          description: The date when the validity period for this document ended, if applicable.
        sourceId:
          type: string
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          example: 324f15f64-5717-4562-b3fc-2c963f66ffa1
          readOnly: true
        supplementaryData:
          $ref: '#/components/schemas/Document-Supplementary-Data'
        customAttributes:
          $ref: '#/components/schemas/Custom-Attributes'
        attachments:
          type: array
          description: 'List of scans, pages, or files for a single document, e.g., front and back images of a driver licence, or page 1, 2, and 3 of a supporting document.


            Attachments can be uploaded in a single call or in multiple calls. To upload attachments over multiple calls, include the documentId in the request.'
          items:
            $ref: '#/components/schemas/Document-Attachment'
    Activity-Result-ID:
      type: string
      readOnly: true
      description: Activity Result ID that identifies a result from an evaluation of an activity
      format: ulid
    Activity-ID:
      type: string
      readOnly: true
      description: Activity ID that identifies an activity within the Frankie platform
      format: ulid
    Supplementary-Data-KYB-Organization:
      type: object
      description: 'Defines OQRO (Ownership Query Result Object) at various stages in the KYB (Know Your Business) flow.

        The ''oqro'' property temporarily stores the V1 OQRO and will be used until the V2 OQRO is defined.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          organization:
            description: 'V2 OQRO; to be defined in the future.

              '
            properties:
              entityId:
                $ref: '#/components/schemas/Entity-ID'
              entityType:
                $ref: '#/components/schemas/Entity-Type'
    Document-Supplementary-Data-Citizenship:
      type: object
      description: Supplementary information relevant to a citizenship certificate.
      allOf:
      - $ref: '#/components/schemas/Document-Supplementary-Data-Base'
      - type: object
        description: Supplementary information relevant to a citizenship certificate.
        properties:
          acquisitionDate:
            type: string
            description: The date citizenship was acquired.
            example: 2000/01/01
          primaryCountry:
            type: string
            description: The primary country of citizenship, represented by its three-letter ISO 3166-1 alpha-3 code.
            example: USA
          secondaryCountry:
            type: string
            description: The secondary country of citizenship, if applicable, represented by its three-letter ISO 3166-1 alpha-3 code.
            example: CAN
    Supplementary-Data-AML-AdditionalData:
      type: object
      description: 'Represents a simple key-value pair for AML data to capture any additional information not included in the main object.

        '
      properties:
        key:
          type: string
          description: 'The key name, formatted in snake_case (e.g., key_in_snake_case), which can be converted to spaced title case for display.

            '
        value:
          type: string
          description: 'The value associated with the key, provided as a string for display purposes.

            '
    Supplementary-Data-IDV-Facial-Comparison:
      type: object
      description: 'Result of a facial comparison check, indicating how likely or accurate the presented face matches the ID document.


        For resultMap keys, use the keys found in the enum: SupplementaryDataIDVEnumDataFacialComparison.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-IDV-Base'
      - type: object
        properties:
          comparedDocumentId:
            type: string
            format: uuid
            description: The document ID of the ID document that was compared.
          comparedDocumentAttachmentId:
            type: string
            format: uuid
            description: The attachment ID of the ID document that was compared.
          comparedSelfieId:
            type: string
            format: uuid
            description: The document ID of the selfie that was compared.
          comparedSelfieAttachmentId:
            type: string
            format: uuid
            description: The attachment ID of the selfie that was compared.
    Process-Result-Manual-StatusEnum-Matchlist:
      type: string
      enum:
      - FALSE_POSITIVE
      - TRUE_POSITIVE_REJECT
      description: 'Any manual status set after the results have been reviewed.

        - FALSE_POSITIVE: The result is determined to be a false positive, but you do not necessarily want to resolve it.

        - TRUE_POSITIVE_REJECT: The result is determined to be a true positive and you want to resolve it. "Reject" infers you want to reject the activity.

        '
    Date-Of-Birth-Alternate:
      type: object
      allOf:
      - type: object
        properties:
          dateOfBirthId:
            type: string
            description: 'As dates of birth are added to an entity, they are assigned a unique identifier to assist with modification and reference.

              To modify a date of birth, include the dateOfBirthId in an update request for the individual.'
          sourceId:
            type: string
            description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
            readOnly: true
      - $ref: '#/components/schemas/Date'
    Email:
      type: object
      properties:
        emailAddressId:
          $ref: '#/components/schemas/Email-Address-ID'
        type:
          type: string
          enum:
          - OTHER
          - WORK
          - PERSONAL
          - BUSINESS
          example: WORK
          description: The type of email address, if known.
        sourceId:
          type: string
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          example: 31dd15f64-5717-4562-b3fc-2c963f66234d
          readOnly: true
        email:
          type: string
          description: The individual's email address. This email can be used to notify the individual of any verification requirements.
          example: leonardo_dc@outlook.com
        isPreferred:
          type: boolean
          description: Indicates whether this email address is the individual's preferred email. The preferred email will be used to send notifications at the client's request.
          default: true
        linkedAddresses:
          type: array
          readOnly: true
          description: If the email is attached to one or more addresses, the address IDs of those addresses will be present.
          items:
            type: object
            properties:
              addressId:
                description: The addressId of the linked address.
                type: string
                example: adc215f64-5717-4562-b3fc-2c963f66222a
    Error-Base:
      type: object
      properties:
        errorCode:
          type: string
        errorMsg:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    Rule-ID:
      type: string
      readOnly: true
      format: ulid
      description: Rule ID that identifies an instance of a rule within the Frankie platform
    Supplementary-Data-Duplicate:
      type: object
      description: 'Provides details of a single duplicate match, including the matching entity ID and a list of matched elements.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          duplicateEntityId:
            $ref: '#/components/schemas/Entity-ID'
            description: The entity ID of the entity that was matched by the matched fields.
          matchedFields:
            type: array
            description: The list of fields that determined this is a duplicate of another entity.
            items:
              $ref: '#/components/schemas/Supplementary-Data-Duplicate-MatchField'
          matchedRules:
            type: array
            description: The list of rules that were matched to determine this is a duplicate of another entity.
            items:
              $ref: '#/components/schemas/Supplementary-Data-Duplicate-MatchedRule'
    IDV-InitProcess-Request:
      type: object
      description: Init IDV Process Request, used after capture of IDV data from a customer, including photos/videos of the face and ID. For providers that support it, this will synchronously report all report results from the provider. For providers that do not support synchronous reporting, this will request the reports and return a request id and status. The status can be polled for the final result or sent via webhook. Body parameters are optional, if they are not sent, then the latest token for the entity is used.
      properties:
        providerReferenceId:
          description: provider reference Id if known. May be referred to as checkId or interviewId in vendor specific document
          example: 41cf9401f0f889616bef
          type: string
        token:
          description: if no check id has yet been created for this idv check, pass through the token instead
          example: 41cf9401f0f889616bef
          type: string
        comment:
          $ref: '#/components/schemas/Comment'
    Process-Result-ID:
      type: string
      description: When a process result object is first created, it is assigned an ID. When updating the process result object, set the processResultID to the ID of the process result object you are referring to.
      readOnly: true
    Supplementary-Data-Duplicate-MatchField:
      type: object
      description: 'Provides details of a match between entities, the objects they represent, and the match strength.

        '
      properties:
        objectType:
          $ref: '#/components/schemas/Object-Type'
        duplicateObjectId:
          type: string
          format: uuid
          description: The ID of the object that was found to be a duplicate.
        objectId:
          type: string
          format: uuid
          description: The ID of the object that originated the match.
        matchStrength:
          $ref: '#/components/schemas/Supplementary-Data-Base-MatchStrength'
    Document-Supplementary-Data-Base:
      type: object
      description: Supplementary data associated with a document.
      required:
      - type
      properties:
        type:
          type: string
          description: The document type that defines the type of supplementary data returned.
          enum:
          - NATIONAL_HEALTH_ID
          - BIRTH_CERT
          - NATIONAL_ID
          - CITIZENSHIP
          - PASSPORT
          - MARRIAGE_CERT
    Supplementary-Data-AML-MediaData:
      type: object
      required:
      - title
      - source
      description: 'Contains adverse media information about a specific matched entity.

        '
      properties:
        title:
          type: string
          description: 'The title of the article or media source.

            '
        snippet:
          type: string
          description: 'A short excerpt or snippet from the article.

            '
        source:
          type: string
          description: 'The source or publisher of the article or media.

            '
        sourceDate:
          type: string
          description: 'The publication date, as referenced and formatted by the source.

            '
        sourceCountry:
          type: string
          description: 'The country of origin for the article, if available.

            '
        url:
          type: string
          description: 'The URL to the original full article, if available.

            '
        isCurrent:
          type: boolean
          default: true
          description: 'Indicates whether this article is still considered current.

            '
    Evaluation-ID:
      type: string
      description: The ID of the evaluation
      readOnly: true
      format: ulid
    Document-Supplementary-Data:
      type: object
      description: Supplementary information relevant to a specific document or report type.
      oneOf:
      - $ref: '#/components/schemas/Document-Supplementary-Data-National-Health-ID'
      - $ref: '#/components/schemas/Document-Supplementary-Data-Birth-Certificate'
      - $ref: '#/components/schemas/Document-Supplementary-Data-National-ID'
      - $ref: '#/components/schemas/Document-Supplementary-Data-Citizenship'
      - $ref: '#/components/schemas/Document-Supplementary-Data-Passport'
      - $ref: '#/components/schemas/Document-Supplementary-Data-Marriage-Certificate'
      discriminator:
        propertyName: type
        mapping:
          NATIONAL_HEALTH_ID: '#/components/schemas/Document-Supplementary-Data-National-Health-ID'
          BIRTH_CERT: '#/components/schemas/Document-Supplementary-Data-Birth-Certificate'
          NATIONAL_ID: '#/components/schemas/Document-Supplementary-Data-National-ID'
          CITIZENSHIP: '#/components/schemas/Document-Supplementary-Data-Citizenship'
          PASSPORT: '#/components/schemas/Document-Supplementary-Data-Passport'
          MARRIAGE_CERT: '#/components/schemas/Document-Supplementary-Data-Marriage-Certificate'
    Individual:
      type: object
      allOf:
      - $ref: '#/components/schemas/Base-Individual'
      - type: object
        properties:
          informationSources:
            type: object
            description: Map of information sources used across the response.
            additionalProperties:
              $ref: '#/components/schemas/Information-Source'
            readOnly: true
          relationships:
            $ref: '#/components/schemas/Individual-Relationships'
    Entity:
      type: object
      properties:
        entityId:
          $ref: '#/components/schemas/Entity-ID'
        entityType:
          $ref: '#/components/schemas/Entity-Type'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        schemaVersion:
          type: integer
          description: The schema version of this entity.
          example: 2
          readOnly: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: A list of all address information associated with the entity.
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/Phone-Number'
          description: A list of all phone numbers associated with the entity.
        emailAddresses:
          type: array
          items:
            $ref: '#/components/schemas/Email'
          description: A list of all email addresses associated with the entity.
        customAttributes:
          $ref: '#/components/schemas/Custom-Attributes'
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/External-Reference'
          description: A list of all external references associated with the entity.
        documents:
          $ref: '#/components/schemas/Entity-Documents'
        sourceId:
          type: string
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          readOnly: true
    Supplementary-Data-Fraud-Device:
      type: object
      description: 'Provides details of a single device fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Supplementary-Data-Fraud-Device-Data'
    Supplementary-Data-ID:
      type: object
      description: 'Provides the matching levels found for each ID element, where available.

        Match strength is scaled from 0 (no match) to 100 (full match).

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-ID-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Indicator-ID:
      type: string
      readOnly: true
      format: ulid
      description: Indicator ID that identifies an indicator from a check on an activity
    Individual-Name-Alternate:
      type: object
      required:
      - familyName
      x-examples:
        Example 1:
          givenName: John
          middleName: Jacob
          familyName: Smith
      properties:
        nameId:
          type: string
          example: 87654321-4321-4321-4321-210987654321
          description: Include the nameId of an existing name for this individual to modify it.
        language:
          type: string
          example: eng
          description: The ISO-639-3 standard code that best represents the language and character set of the individual's name.
          default: eng
        givenName:
          type: string
          example: John
          description: First name or given name.
        middleName:
          type: string
          example: R
          description: Middle name(s) or middle initial(s).
        familyName:
          type: string
          example: Doe
          description: Last name, family name, or surname.
        otherName:
          type: string
          example: null
          description: Other names to be stored with the entity.
        prefix:
          type: string
          example: Dr.
          description: Element or series of letters that precede the individual's full name (e.g., title or honorific).
        suffix:
          type: string
          example: Jr.
          description: Element or series of letters that follow the individual's full name (e.g., generational suffix).
        sourceId:
          type: string
          example: 87654321-4321-4321-4321-210987654322
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          readOnly: true
        displayName:
          type: string
          example: John Doe
          description: Long format of the individual's full name, including any prefix, suffix, middle, or other names. Best used when the proper structure of the individual's name is unknown.
        type:
          type: string
          example: OTHER
          enum:
          - OTHER
          - ALIAS
          - PREVIOUS
          description: Classification of the individual's name in relation to any of their alternative names.
    Supplementary-Data-AML-RelatedParties:
      type: object

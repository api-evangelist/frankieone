        isExpired:
          type: boolean
          description: Indicates if the ID has expired (if known).
        isBlocked:
          type: boolean
          description: Indicates if the ID has been blocked at the source.
        blockingCode:
          type: string
          description: If the service provider returns a blocking code or reason, it will be recorded here.
        attachmentId:
          type: string
          format: uuid
          description: If a photo was sent to the service provider, the FrankieOne scanId is added for reference.
        photoId:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: If a photo was supplied and checked, the match score is recorded here.
        photoIssue:
          type: string
          description: If there was an issue checking the photo, any error details can be found here.
    Service-Profile-State:
      type: string
      description: 'Current state of the Service Profile

        - INIT: Initial state when the profile is created.

        - AUTO: Automatically assigned state, typically after initial processing.

        - ACTIVE: The profile is active and in use.

        - ARCHIVED: The profile has been archived and is no longer active.

        - BLOCKLISTED: The profile is blocked from further actions.

        - INACTIVE: The profile is inactive, not currently in use.

        - DELETED: The profile has been deleted.

        - DUPLICATE: The profile is a duplicate of another existing profile.'
      enum:
      - INIT
      - AUTO
      - ACTIVE
      - ARCHIVED
      - BLOCKLISTED
      - INACTIVE
      - DELETED
      - DUPLICATE

          minimum: 0
          maximum: 100
        name:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'If the name verification result is known, record it here.


            NOTE: This should not be used as a KYC result; informational only.

            Please use a separate PRO for an actual KYC result if required.

            '
        dateOfBirth:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'If the date of birth verification result is known, record it here.


            NOTE: This should not be used as a KYC result; informational only.

            Please use a separate PRO for an actual KYC result if required.

            '
        expiryDate:
          type: integer
          format: int32
          minimum: 0
          maximum: 100

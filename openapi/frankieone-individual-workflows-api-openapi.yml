          description: A list of all phone numbers associated with the entity.
        emailAddresses:
          type: array
          items:
            $ref: '#/components/schemas/Email'
          description: A list of all email addresses associated with the entity.
        customAttributes:
          $ref: '#/components/schemas/Custom-Attributes'
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/External-Reference'
          description: A list of all external references associated with the entity.
        documents:
          $ref: '#/components/schemas/Entity-Documents'
        sourceId:
          type: string
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          readOnly: true
    Supplementary-Data-Fraud-Device:
      type: object
      description: 'Provides details of a single device fraud check.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - $ref: '#/components/schemas/Supplementary-Data-Fraud-Device-Data'
    Supplementary-Data-ID:
      type: object
      description: 'Provides the matching levels found for each ID element, where available.

        Match strength is scaled from 0 (no match) to 100 (full match).

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-ID-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
    Indicator-ID:
      type: string
      readOnly: true
      format: ulid
      description: Indicator ID that identifies an indicator from a check on an activity
    Individual-Name-Alternate:
      type: object
      required:
      - familyName
      x-examples:
        Example 1:
          givenName: John
          middleName: Jacob
          familyName: Smith
      properties:
        nameId:
          type: string
          example: 87654321-4321-4321-4321-210987654321
          description: Include the nameId of an existing name for this individual to modify it.
        language:
          type: string
          example: eng
          description: The ISO-639-3 standard code that best represents the language and character set of the individual's name.
          default: eng
        givenName:
          type: string
          example: John
          description: First name or given name.
        middleName:
          type: string
          example: R
          description: Middle name(s) or middle initial(s).
        familyName:
          type: string
          example: Doe
          description: Last name, family name, or surname.
        otherName:
          type: string
          example: null
          description: Other names to be stored with the entity.
        prefix:
          type: string
          example: Dr.
          description: Element or series of letters that precede the individual's full name (e.g., title or honorific).
        suffix:
          type: string
          example: Jr.
          description: Element or series of letters that follow the individual's full name (e.g., generational suffix).
        sourceId:
          type: string
          example: 87654321-4321-4321-4321-210987654322
          description: The source from which specific information was sourced. This is a link to an informationSource object in the informationSources map.
          readOnly: true
        displayName:
          type: string
          example: John Doe
          description: Long format of the individual's full name, including any prefix, suffix, middle, or other names. Best used when the proper structure of the individual's name is unknown.
        type:
          type: string
          example: OTHER
          enum:
          - OTHER
          - ALIAS
          - PREVIOUS
          description: Classification of the individual's name in relation to any of their alternative names.
    Supplementary-Data-AML-RelatedParties:
      type: object
      description: 'Defines the name and relationship of individuals or organizations related to the matched entity.

        '
      properties:
        name:
          type: string
          description: The name of the related individual or organization.
        relationship:
          type: string
          description: 'The nature of the relationship to the matched entity.

            For example: "Sibling", "Director", "Known associate".

            '
    Process-Risk-Factor-Value:
      type: object
      description: Risk Factor Value
      required:
      - factor
      - value
      properties:
        factor:
          type: string
          description: Name of the risk factor.
        value:
          type: string
          description: Supplier/service provided value that Frankie will plug into the risk engine to determine a score.
    Workflow-Execution-ObjectTypeEnum:
      description: 'The type of primary object that was checked. Either:

        - NAME

        - ADDRESS

        - DATE_OF_BIRTH

        - ORGANIZATION

        - DOCUMENT

        - EMAIL_ADDRESS

        - PHONE_NUMBER

        - DEVICE

        - INDIVIDUAL

        '
      type: string
      enum:
      - NAME
      - ADDRESS
      - DATE_OF_BIRTH
      - ORGANIZATION
      - DOCUMENT
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - DEVICE
      - INDIVIDUAL
    Workflow-Issue-Type:
      type: string
      enum:
      - AML_ISSUE
      - BAD_DATA_ADDRESS
      - BAD_DATA_DOB
      - BAD_DATA_EMAIL
      - BAD_DATA_ID
      - BAD_DATA_MOBILE
      - BAD_DATA_NAME
      - BLOCKED
      - COMPROMISED_DOCUMENT
      - CREDIT_HEADER
      - DATA_COMPARISON
      - DATA_CONSISTENCY
      - DATA_VALIDATION
      - DENY_LIST
      - DECEASED
      - DEVICE_FRAUD_MATCH
      - DEVICE_INVALID
      - DOCUMENT_COMPARISON
      - DUPLICATE
      - FRAUD_CHECK
      - FRAUD_DEVICE
      - FRAUD_IP_ADDRESS
      - FRAUD_EMAIL_ADDRESS
      - FRAUD_PHONE_NUMBER
      - FRAUD_ISSUE
      - FRAUD_LIST
      - IMAGE_INTEGRITY
      - INTERNAL_MATCH
      - LIVENESS_DETECTION
      - MATCHED_EXTERNAL
      - MATCHED_INTERNAL
      - MATCHED_SHARED
      - MEDIA
      - NOT_FOUND
      - OCR
      - PARTIAL
      - PEP
      - REQUIRES_AML
      - REQUIRES_IDV
      - REQUIRES_KYC
      - REQUIRES_VISA
      - SANCTION
      - SERVICE_ERROR
      - SERVICE_TIMEOUT
      - VISA_FAILED
      - VISUAL_AUTHENTICITY
      - WATCHLIST
      - ACTIVITY_AML
      - ACTIVITY_FRAUD
      - ACTIVITY_DEVICE
      description: "For each category, this provides the specific issue type.\n\nAML:\n  - PEP: The entity has Politically Exposed Person (PEP) hits.\n  - SANCTION: The entity has sanction hits.\n  - MEDIA: The entity has adverse media hits.\n  - WATCHLIST: The entity has watchlist hits.\n\nBAD_DATA:\n  - BAD_DATA_NAME: Name is required for verification but is missing or unusable due to data quality issues.\n  - BAD_DATA_DOB: Date of Birth is required for verification but is missing or unusable due to data quality issues.\n  - BAD_DATA_ADDRESS: Address is required for verification but is missing or unusable due to data quality issues.\n  - BAD_DATA_ID: ID is required for verification but is missing or unusable due to data quality issues.\n  - BAD_DATA_EMAIL: Email is required for verification but is missing or unusable due to data quality issues.\n  - BAD_DATA_MOBILE: Mobile is required for verification but is missing or unusable due to data quality issues.\n\nBLOCKLISTED:\n  - MATCHED_INTERNAL: The entity matched an internal blocklist.\n  - MATCHED_SHARED: The entity matched a shared blocklist.\n  - MATCHED_EXTERNAL: The entity matched an external blocklist.\n\nDECEASED:\n  - DECEASED: The person whose data is being verified is deceased.\n\nDEVICE:\n  - DEVICE_FRAUD_MATCH: Fraud detected on the device.\n  - DEVICE_INVALID: The device is invalid.\n\nDUPLICATE:\n  - DUPLICATE: The entity is a duplicate of another entity.\n\nEXPIRY:\n  - REQUIRES_KYC: KYC process needs to be re-initiated.\n  - REQUIRES_IDV: IDV process needs to be re-initiated.\n  - REQUIRES_AML: AML process needs to be re-initiated.\n  - REQUIRES_VISA: Visa process needs to be re-initiated.\n\nFRAUD:\n  - FRAUD_LIST: The entity is on a fraud list.\n  - FRAUD_CHECK: Fraud detected during checks.\n  - FRAUD_DEVICE: Device fraud detected.\n  - FRAUD_IP_ADDRESS: IP address fraud detected.\n  - FRAUD_EMAIL_ADDRESS: Email address fraud detected.\n  - FRAUD_PHONE_NUMBER: Phone number fraud detected.\n\nIDV:\n  - DATA_COMPARISON: Data comparison issue.\n  - DATA_VALIDATION: Data validation issue.\n  - DATA_CONSISTENCY: Data consistency issue.\n  - VISUAL_AUTHENTICITY: Visual authenticity issue.\n  - IMAGE_INTEGRITY: Image integrity issue.\n  - COMPROMISED_DOCUMENT: Document is compromised.\n  - LIVENESS_DETECTION: Liveness detection failed.\n  - DOCUMENT_COMPARISON: Document comparison issue.\n\nINFORMATIONAL:\n  - CREDIT_HEADER: Credit header information was returned as part of a credit agency check.\n\nKYC:\n  - PARTIAL: The KYC check was only partially successful.\n  - NOT_FOUND: No match was found for the given data.\n\nOCR:\n  - OCR: The OCR data does not match what was entered by the user.\n\nSYSTEM:\n  - SERVICE_TIMEOUT: All providers have timed out.\n  - SERVICE_ERROR: All providers have returned an error or an internal error has occurred.\n\nVISA:\n  - DENY_LIST: The entity matched a visa deny list.\n  - VISA_FAILED: Visa check failed from the provider.\n\nWATCHLIST:\n  - INTERNAL_MATCH: The entity matched an internal watchlist.\n\nACTIVITY:\n  - ACTIVITY_AML: AML-related activity issue.\n  - ACTIVITY_FRAUD: Fraud-related activity issue.\n  - ACTIVITY_DEVICE: Device-related activity issue."
    Supplementary-Data-KYC-Gender:
      type: object
      description: 'Defines the matching results for a gender check. This is rarely used.

        '
      allOf:
      - $ref: '#/components/schemas/Supplementary-Data-Base'
      - type: object
        properties:
          matchStrengths:
            $ref: '#/components/schemas/Supplementary-Data-KYC-Gender-MatchStrengths'
          fuzziness:
            $ref: '#/components/schemas/FuzzinessLevel'
          wasNameMatchStrongEnough:
            description: 'Indicates whether there was a sufficiently strong name match at the time this was checked, even if the gender was a perfect match.

              This is only an indicator at the time the PRO was created. Subsequent checks that reuse this result may interpret this differently.

              '
            type: boolean
    Device-ID:
      type: string
      description: ID of the device
      readOnly: true
      format: ulid
    Supplementary-Data-Base:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: "The type of supplementary data. Possible values:\n  - AML\n  - KYC_ADDRESS\n  - KYC_DOB\n  - KYC_GENDER\n  - KYC_NAME\n  - ID\n  - VISA\n  - NAME_VALIDATION\n  - KYB_ORGANIZATION\n  - MATCHLIST\n  - DUPLICATE\n  - FRAUD_DEVICE\n  - FRAUD_EMAIL\n  - FRAUD_PHONE\n  - FRAUD_LOOKUP\n  - ACTIVITY_AML\n  - ACTIVITY_DEVICE\n  - ACTIVITY_FRAUD\n"
          enum:
          - AML
          - KYC_ADDRESS
          - KYC_DOB
          - KYC_GENDER
          - KYC_NAME
          - ID
          - VISA
          - NAME_VALIDATION
          - KYB_ORGANIZATION
          - MATCHLIST
          - DUPLICATE
          - FRAUD_DEVICE
          - FRAUD_EMAIL_ADDRESS
          - FRAUD_PHONE_NUMBER
          - FRAUD_IP_ADDRESS
          - FRAUD_LOOKUP
          - ACTIVITY_AML
          - ACTIVITY_DEVICE
          - ACTIVITY_FRAUD
    Date-Type:
      type: string
      default: GREGORIAN
      enum:
      - BUDDHIST
      - DISCORDIAN
      - GREGORIAN
      - HEBREW
      - ISLAMIC
      - JULIAN
      - LUNAR
      - MESO_AMERICAN
